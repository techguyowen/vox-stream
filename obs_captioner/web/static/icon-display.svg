<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background OLED / Slate Gradient -->
    <linearGradient id="displayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Screen Inner Bezel Gradient -->
    <linearGradient id="screenBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Glowing Text Flow Gradient -->
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background App Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#displayBg)" filter="url(#shadowFilter)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="6"/>

  <!-- Monitor Screen Frame (Confidence Monitor) -->
  <rect x="76" y="90" width="360" height="240" rx="20" fill="url(#screenBezel)" stroke="#475569" stroke-width="6"/>
  <!-- Screen Glass Surface -->
  <rect x="92" y="106" width="328" height="208" rx="10" fill="#090D16"/>

  <!-- Monitor Stand Neck -->
  <polygon points="236,330 276,330 286,395 226,395" fill="#334155"/>
  <!-- Monitor Base Foot -->
  <rect x="186" y="395" width="140" height="18" rx="9" fill="#475569"/>

  <!-- Top Status Badge on Screen (LIVE PROMPTER) -->
  <circle cx="120" cy="132" r="7" fill="#10B981"/>
  <rect x="136" y="126" width="70" height="12" rx="6" fill="#1E293B"/>

  <!-- Live Caption Text Lines on Confidence Monitor -->
  <!-- Line 1: In-Progress Live Caption Stream -->
  <rect x="120" y="160" width="220" height="18" rx="9" fill="url(#glowCyan)" filter="url(#neonGlow)"/>
  <rect x="350" y="160" width="42" height="18" rx="9" fill="#38BDF8" opacity="0.6"/>

  <!-- Line 2: Follow-up Line -->
  <rect x="120" y="195" width="272" height="18" rx="9" fill="url(#glowAmber)"/>

  <!-- Line 3: History / Previous Sentence (dimmed) -->
  <rect x="120" y="230" width="190" height="14" rx="7" fill="#64748B" opacity="0.5"/>
  <rect x="320" y="230" width="50" height="14" rx="7" fill="#64748B" opacity="0.3"/>

  <!-- Live Prompt Cursor Blinker -->
  <rect x="398" y="195" width="8" height="18" rx="4" fill="#FCD34D"/>

  <!-- Floating Stage Indicator Pill (Bottom Right Corner Badge) -->
  <g transform="translate(340, 360)">
    <rect x="0" y="0" width="120" height="42" rx="21" fill="#2563EB" stroke="#60A5FA" stroke-width="3" filter="url(#shadowFilter)"/>
    <text x="60" y="26" fill="#FFFFFF" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1">STAGE</text>
  </g>
</svg>
