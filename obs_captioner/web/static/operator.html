<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VoxStream Mobile Operator</title>
    
    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #090D16;
            --bg-card: #151D2A;
            --bg-card-alt: #1E293B;
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #38BDF8;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* App Container */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 14px 14px 40px 14px;
            gap: 14px;
        }

        /* Header Bar */
        .header-bar {
            background: rgba(21, 29, 42, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            position: sticky;
            top: 10px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 16px;
            color: var(--primary);
            letter-spacing: -0.3px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: #34D399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.offline {
            background: rgba(239, 68, 68, 0.15);
            color: #FCA5A5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            display: inline-block;
        }

        /* Card Section */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .card-title {
            font-size: 13.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Live Audio & Meter Bar */
        .audio-meter-box {
            background: #0D131F;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .vu-wrapper {
            flex: 1;
            height: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .vu-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10B981, #F59E0B, #EF4444);
            border-radius: 6px;
            transition: width 0.08s ease;
        }

        .vu-db-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            min-width: 55px;
            text-align: right;
        }

        /* Control Buttons (Touch-Optimized) */
        .btn {
            width: 100%;
            min-height: 54px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease, opacity 0.15s ease, background-color 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            padding: 10px 16px;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .btn-success {
            background: linear-gradient(135deg, #10B981, #059669);
            color: #FFFFFF;
        }

        .btn-danger {
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: #FFFFFF;
        }

        .btn-warning {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #000000;
        }

        .btn-secondary {
            background: #1E293B;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Form Inputs */
        .input-group {
            display: flex;
            gap: 8px;
        }

        .form-control {
            flex: 1;
            min-height: 48px;
            background: #0D131F;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        /* Engine Pill Grid */
        .engine-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .engine-pill {
            background: #1E293B;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        .engine-pill.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Sermon Context Box */
        .context-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .context-label {
            font-size: 10.5px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
        }

        .context-value {
            font-size: 13.5px;
            font-weight: 700;
            color: #7DD3FC;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            background: rgba(15, 23, 42, 0.95);
            color: var(--text-main);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 13.5px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Mic Silence Warning */
        #mic-silence-warning {
            display: none;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #FCA5A5;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sticky Header Bar -->
        <header class="header-bar">
            <div class="brand-title">
                <span>🎙️</span> VoxStream Mobile
            </div>
            <div id="conn-badge" class="status-badge offline">
                <span class="status-dot"></span>
                <span id="conn-text">Connecting...</span>
            </div>
        </header>

        <!-- Live Audio & Active Engine Card -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><span>🔊</span> Live Microphone &amp; Audio</div>
                <span id="active-engine-badge" style="font-size: 11px; font-weight: 700; color: var(--primary);">Loading Engine...</span>
            </div>

            <div class="audio-meter-box">
                <span style="font-size: 11px; font-weight: 800; color: var(--text-muted);">MIC</span>
                <div class="vu-wrapper">
                    <div id="vu-bar" class="vu-bar"></div>
                </div>
                <span id="vu-db" class="vu-db-text">-∞ dB</span>
            </div>

            <div id="mic-silence-warning">
                ⚠️ Mic Muted / No Signal (&lt; -55 dBFS)
            </div>
        </div>

        <!-- Primary System Controls (Big Actions) -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><span>⚡</span> Core Master Controls</div>
            </div>

            <!-- Start / Pause Captions Toggle Button -->
            <button id="btn-toggle-captions" class="btn btn-success">
                <span>▶️</span> Start STT Captions
            </button>

            <div class="btn-grid">
                <!-- Panic Wipe Button -->
                <button id="btn-panic" class="btn btn-danger" style="min-height: 48px; font-size: 13.5px;">
                    <span>🚨</span> Panic Wipe
                </button>
                <!-- Clear Subtitles Button -->
                <button id="btn-clear" class="btn btn-secondary" style="min-height: 48px; font-size: 13.5px;">
                    <span>🧹</span> Clear Display
                </button>
            </div>
        </div>

        <!-- STT Recognition Model Selection -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><span>⚙️</span> Speech Recognition Engine</div>
            </div>
            <div class="engine-grid" id="engine-grid">
                <button class="engine-pill" data-engine="vosk">⚡ Vosk (Local)</button>
                <button class="engine-pill" data-engine="gemini_live">✨ Gemini Live</button>
                <button class="engine-pill" data-engine="parakeet">🚀 Parakeet ONNX</button>
                <button class="engine-pill" data-engine="moonshine">🌙 Moonshine</button>
                <button class="engine-pill" data-engine="sherpa">🏔️ Sherpa-ONNX</button>
                <button class="engine-pill" data-engine="sensevoice">🌐 SenseVoice</button>
            </div>
        </div>

        <!-- Scripture Quick Prompter & Context -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><span>📖</span> Scripture Quick Prompter</div>
            </div>

            <!-- Sermon Context Memory -->
            <div class="context-box">
                <div class="context-label">Active Sermon Text</div>
                <div id="ctx-primary-val" class="context-value">None set (Listening...)</div>
            </div>

            <div class="input-group">
                <input type="text" id="scripture-input" placeholder="e.g. John 3:16 or Romans 8" class="form-control">
                <button id="btn-push-scripture" class="btn btn-warning" style="width: auto; min-height: 48px; padding: 0 16px;">
                    <span>📺</span> Push
                </button>
            </div>

            <div class="btn-grid">
                <button id="btn-set-context" class="btn btn-secondary" style="min-height: 44px; font-size: 12.5px;">
                    <span>📌</span> Set Main Text
                </button>
                <button id="btn-dismiss-scripture" class="btn btn-secondary" style="min-height: 44px; font-size: 12.5px;">
                    <span>🧹</span> Dismiss Card
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        (function() {
            'use strict';

            // DOM Elements
            const connBadge = document.getElementById('conn-badge');
            const connText = document.getElementById('conn-text');
            const vuBar = document.getElementById('vu-bar');
            const vuDb = document.getElementById('vu-db');
            const micWarning = document.getElementById('mic-silence-warning');
            const activeEngineBadge = document.getElementById('active-engine-badge');
            const btnToggleCaptions = document.getElementById('btn-toggle-captions');
            const btnPanic = document.getElementById('btn-panic');
            const btnClear = document.getElementById('btn-clear');
            const scriptureInput = document.getElementById('scripture-input');
            const btnPushScripture = document.getElementById('btn-push-scripture');
            const btnSetContext = document.getElementById('btn-set-context');
            const btnDismissScripture = document.getElementById('btn-dismiss-scripture');
            const ctxPrimaryVal = document.getElementById('ctx-primary-val');
            const toastContainer = document.getElementById('toast-container');

            let isRunning = false;
            let controlWs = null;
            let micSilenceTimer = null;

            // Toast Helper
            function showToast(msg, duration = 2500) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = msg;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 20);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, duration);
            }

            // Fetch Live Status & Config
            async function fetchStatus() {
                try {
                    const res = await fetch('/api/status');
                    if (res.ok) {
                        const data = await res.json();
                        updateStatusUI(data);
                    }
                } catch(e) {
                    console.warn("Status fetch error:", e);
                }
            }

            async function fetchSermonContext() {
                try {
                    const res = await fetch('/api/bible/context');
                    if (res.ok) {
                        const data = await res.json();
                        const ctx = data.context || {};
                        if (ctxPrimaryVal) {
                            ctxPrimaryVal.textContent = ctx.primary_citation || "None set (Listening...)";
                        }
                    }
                } catch(e) {
                    console.warn("Context fetch error:", e);
                }
            }

            function updateStatusUI(data) {
                isRunning = !!data.is_running;
                if (btnToggleCaptions) {
                    if (isRunning) {
                        btnToggleCaptions.className = 'btn btn-danger';
                        btnToggleCaptions.innerHTML = '<span>⏹</span> Pause STT Captions';
                    } else {
                        btnToggleCaptions.className = 'btn btn-success';
                        btnToggleCaptions.innerHTML = '<span>▶️</span> Start STT Captions';
                    }
                }

                const engineName = data.engine_name || data.engine || 'Vosk';
                if (activeEngineBadge) {
                    activeEngineBadge.textContent = isRunning ? `🟢 ${engineName}` : `⏸️ ${engineName} (Paused)`;
                }

                // Update active pill highlight
                document.querySelectorAll('.engine-pill').forEach(pill => {
                    if (pill.dataset.engine === data.engine) {
                        pill.classList.add('active');
                    } else {
                        pill.classList.remove('active');
                    }
                });
            }

            // WebSockets Connection
            function connectWs() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/api/control/ws`;
                controlWs = new WebSocket(wsUrl);

                controlWs.onopen = () => {
                    connBadge.className = 'status-badge';
                    connText.textContent = 'Live';
                };

                controlWs.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'vu_meter') {
                            const db = typeof msg.level_db === 'number' ? msg.level_db : -100;
                            const pct = Math.max(0, Math.min(100, ((db + 60) / 60) * 100));
                            if (vuBar) vuBar.style.width = `${pct}%`;
                            if (vuDb) vuDb.textContent = db <= -58 ? '-∞ dB' : `${db.toFixed(1)} dB`;

                            // Silence check
                            if (isRunning && (db <= -55 || db === -100)) {
                                if (!micSilenceTimer) micSilenceTimer = Date.now();
                                if (Date.now() - micSilenceTimer >= 5000) {
                                    if (micWarning) micWarning.style.display = 'block';
                                }
                            } else {
                                micSilenceTimer = null;
                                if (micWarning) micWarning.style.display = 'none';
                            }
                        } else if (msg.type === 'engine_changed' || msg.type === 'config_updated') {
                            fetchStatus();
                        }
                    } catch(e) {
                        console.error(e);
                    }
                };

                controlWs.onclose = () => {
                    connBadge.className = 'status-badge offline';
                    connText.textContent = 'Offline';
                    setTimeout(connectWs, 2000);
                };
            }

            // Control Actions
            if (btnToggleCaptions) {
                btnToggleCaptions.addEventListener('click', async () => {
                    try {
                        const res = await fetch('/api/control/toggle', { method: 'POST' });
                        if (res.ok) {
                            const data = await res.json();
                            showToast(data.is_running ? '🟢 STT Captions Started' : '⏸️ STT Captions Paused');
                            fetchStatus();
                        }
                    } catch(e) {
                        showToast('❌ Error toggling engine');
                    }
                });
            }

            if (btnPanic) {
                btnPanic.addEventListener('click', async () => {
                    try {
                        await fetch('/api/control/panic', { method: 'POST' });
                        showToast('🚨 PANIC WIPE: All displays cleared!');
                    } catch(e) {
                        showToast('❌ Error running panic wipe');
                    }
                });
            }

            if (btnClear) {
                btnClear.addEventListener('click', async () => {
                    try {
                        await fetch('/api/control/panic', { method: 'POST' });
                        showToast('🧹 Displays Cleared!');
                    } catch(e) {
                        showToast('❌ Error clearing displays');
                    }
                });
            }

            // Engine Switch Pills
            document.querySelectorAll('.engine-pill').forEach(pill => {
                pill.addEventListener('click', async () => {
                    const engine = pill.dataset.engine;
                    if (!engine) return;
                    showToast(`⏳ Switching engine to ${engine}...`);
                    try {
                        const res = await fetch('/api/config', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ general: { engine: engine } })
                        });
                        if (res.ok) {
                            showToast(`✅ Engine set to ${engine}`);
                            fetchStatus();
                        }
                    } catch(e) {
                        showToast(`❌ Failed to switch engine`);
                    }
                });
            });

            // Scripture Prompter
            if (btnPushScripture) {
                btnPushScripture.addEventListener('click', async () => {
                    const val = scriptureInput ? scriptureInput.value.trim() : '';
                    if (!val) {
                        showToast('Please enter a verse (e.g. John 3:16)');
                        return;
                    }
                    try {
                        const res = await fetch('/api/bible/display', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ citation: val, duration: 14.0 })
                        });
                        const data = await res.json();
                        if (res.ok && data.scripture) {
                            showToast(`📖 Pushed ${data.scripture.citation}!`);
                            scriptureInput.value = '';
                            fetchSermonContext();
                        } else {
                            showToast(`❌ ${data.error || 'Verse not found'}`);
                        }
                    } catch(e) {
                        showToast(`❌ Error pushing scripture`);
                    }
                });
            }

            if (btnSetContext) {
                btnSetContext.addEventListener('click', async () => {
                    const val = scriptureInput ? scriptureInput.value.trim() : '';
                    if (!val) {
                        showToast('Enter passage reference (e.g. Romans 8)');
                        return;
                    }
                    try {
                        const res = await fetch('/api/bible/context', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ citation: val })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            showToast(`📌 Main Sermon Passage set!`);
                            scriptureInput.value = '';
                            fetchSermonContext();
                        } else {
                            showToast(`❌ ${data.error}`);
                        }
                    } catch(e) {
                        showToast(`❌ Error setting context`);
                    }
                });
            }

            if (btnDismissScripture) {
                btnDismissScripture.addEventListener('click', async () => {
                    try {
                        await fetch('/api/bible/dismiss', { method: 'POST' });
                        showToast('🧹 Scripture card dismissed');
                    } catch(e) {
                        console.error(e);
                    }
                });
            }

            // Initial Execution
            fetchStatus();
            fetchSermonContext();
            connectWs();
            setInterval(fetchStatus, 4000);
            setInterval(fetchSermonContext, 5000);
        })();
    </script>
</body>
</html>
