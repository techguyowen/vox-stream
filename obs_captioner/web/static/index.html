<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Captions Overlay</title>
    <!-- Google Fonts so dashboard font choices actually render in the OBS browser source -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Inter:wght@400;600;800&family=Montserrat:wght@400;700;900&family=Open+Sans:wght@400;700&family=Oswald:wght@500;700&family=Poppins:wght@400;600;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="caption-container" class="caption-container">
        <div id="caption-box" class="caption-box hidden">
            <div id="final-lines" class="final-lines"></div>
            <div id="interim-line" class="interim-line"></div>
        </div>
    </div>
    <script src="/static/overlay.js"></script>
</body>
</html>
