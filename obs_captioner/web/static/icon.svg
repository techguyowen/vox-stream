<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Live Pulse Waves -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="#3B82F6" stroke-width="6" opacity="0.25"/>
  <circle cx="256" cy="220" r="180" fill="none" stroke="#3B82F6" stroke-width="4" opacity="0.15"/>

  <!-- Microphone Head -->
  <rect x="206" y="120" width="100" height="180" rx="50" fill="url(#mic)" />
  
  <!-- Microphone Stand / Pickup Arc -->
  <path d="M 166 220 C 166 295, 346 295, 346 220" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <line x1="256" y1="295" x2="256" y2="360" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <line x1="196" y1="360" x2="316" y2="360" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>

  <!-- Soundwave Indicator -->
  <rect x="110" y="410" width="16" height="30" rx="8" fill="#60A5FA" opacity="0.8"/>
  <rect x="146" y="395" width="16" height="60" rx="8" fill="#3B82F6"/>
  <rect x="182" y="380" width="16" height="90" rx="8" fill="#60A5FA"/>
  <rect x="218" y="420" width="16" height="10" rx="5" fill="#93C5FD"/>
  <rect x="254" y="405" width="16" height="40" rx="8" fill="#3B82F6"/>
  <rect x="290" y="375" width="16" height="100" rx="8" fill="#60A5FA"/>
  <rect x="326" y="390" width="16" height="70" rx="8" fill="#3B82F6"/>
  <rect x="362" y="405" width="16" height="40" rx="8" fill="#60A5FA"/>
  <rect x="398" y="415" width="16" height="20" rx="8" fill="#93C5FD"/>
</svg>