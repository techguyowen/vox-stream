<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Dedicated Scripture Overlay</title>
    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    
    <!-- Google Fonts for High-End Broadcast Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&family=Lora:ital,wght@0,600;0,700;1,400;1,600&family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600;700&family=Oswald:wght@500;700&family=Poppins:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 40px;
        }

        body.align-top {
            align-items: flex-start;
            padding-bottom: 0;
            padding-top: 40px;
        }

        /* Dedicated Scripture Lower-Third Card */
        .scripture-container {
            width: 100%;
            max-width: min(1300px, 90vw);
            margin: 0 auto;
            position: relative;
            z-index: 100;
            perspective: 1000px;
        }

        .scripture-card {
            background: rgba(15, 23, 42, 0.94);
            border: 2px solid rgba(245, 158, 11, 0.8);
            border-radius: 14px;
            padding: 20px 30px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.75), 0 0 30px rgba(245, 158, 11, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .scripture-card.hidden {
            opacity: 0;
            transform: translateY(30px) scale(0.97);
            pointer-events: none;
        }

        body.align-top .scripture-card.hidden {
            transform: translateY(-30px) scale(0.97);
        }

        /* Top Gold Accent Bar */
        .scripture-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3.5px;
            background: linear-gradient(90deg, #F59E0B, #FBBF24, #D97706);
        }

        .scripture-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .scripture-badge-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scripture-badge {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #000000;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .scripture-version-tag {
            background: rgba(255, 255, 255, 0.12);
            color: #FBBF24;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .scripture-text {
            font-size: 26px;
            font-weight: 600;
            line-height: 1.45;
            color: #FFFBEB;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
            font-style: italic;
            font-family: 'Lora', Georgia, serif;
            letter-spacing: 0.01em;
        }

        /* Auto-Dismiss Progress Bar */
        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
        }

        .progress-bar-fill {
            height: 100%;
            background: #F59E0B;
            width: 100%;
            transform-origin: left;
        }

        /* Initial Preview / Welcome Card for standalone browser visits */
        .welcome-hint {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 12px;
            color: #FBBF24;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>
    <div class="welcome-hint" id="welcomeHint" style="display: none;">
        📡 OBS Scripture Source Active (Waiting for passage...)
    </div>

    <div class="scripture-container">
        <div id="scripture-card" class="scripture-card hidden">
            <div class="scripture-header">
                <div class="scripture-badge-group">
                    <span class="scripture-badge" id="scripture-citation">📖 BIBLE PASSAGE</span>
                    <span class="scripture-version-tag" id="scripture-version">BSB</span>
                </div>
            </div>
            <div class="scripture-text" id="scripture-text"></div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <script>
        const scriptureCard = document.getElementById("scripture-card");
        const scriptureCitationEl = document.getElementById("scripture-citation");
        const scriptureVersionEl = document.getElementById("scripture-version");
        const scriptureTextEl = document.getElementById("scripture-text");
        const progressFill = document.getElementById("progress-fill");
        const welcomeHint = document.getElementById("welcomeHint");

        let scriptureTimer = null;
        let progressAnim = null;

        // Show welcome indicator if opened directly in browser tab (outside OBS)
        const isObs = window.obsStudio !== undefined || navigator.userAgent.includes("OBS");
        if (!isObs && welcomeHint) {
            welcomeHint.style.display = "block";
            setTimeout(() => { welcomeHint.style.display = "none"; }, 5000);
        }

        // Check for URL test params: e.g. /bible?preview=1
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has("preview")) {
            showScriptureVerse({
                citation: "John 3:16",
                version: "BSB",
                text: "For God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life.",
                duration_seconds: 30
            });
        }

        function showScriptureVerse(data) {
            if (!scriptureCard || !scriptureCitationEl || !scriptureTextEl) return;
            if (scriptureTimer) clearTimeout(scriptureTimer);
            if (progressAnim) progressAnim.cancel();

            scriptureCitationEl.textContent = `📖 ${data.citation || 'Scripture Passage'}`;
            if (scriptureVersionEl) scriptureVersionEl.textContent = data.version || 'BSB';
            scriptureTextEl.textContent = `"${data.text || ''}"`;
            scriptureCard.classList.remove("hidden");

            const dur = (parseFloat(data.duration_seconds) || 14.0) * 1000;

            // Animate progress bar
            if (progressFill) {
                progressFill.style.width = "100%";
                progressAnim = progressFill.animate([
                    { width: "100%" },
                    { width: "0%" }
                ], {
                    duration: dur,
                    easing: "linear"
                });
            }

            scriptureTimer = setTimeout(() => {
                dismissScriptureVerse();
            }, dur);
        }

        function dismissScriptureVerse() {
            if (scriptureTimer) clearTimeout(scriptureTimer);
            if (progressAnim) progressAnim.cancel();
            scriptureTimer = null;
            if (scriptureCard) {
                scriptureCard.classList.add("hidden");
            }
        }

        // Connect dedicated WebSocket listener
        function connectWs() {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log("Connected to VoxStream Scripture WebSocket");
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // ONLY handle scripture events — ignore all regular speech caption text!
                    if (data.type === "scripture_verse") {
                        showScriptureVerse(data);
                    } else if (data.type === "scripture_dismiss") {
                        dismissScriptureVerse();
                    }
                } catch (e) {
                    console.error("Error parsing WebSocket message:", e);
                }
            };

            ws.onclose = () => {
                console.warn("Scripture WebSocket closed. Reconnecting in 2s...");
                setTimeout(connectWs, 2000);
            };

            ws.onerror = (err) => {
                console.error("Scripture WebSocket error:", err);
                ws.close();
            };
        }

        connectWs();
    </script>
</body>
</html>
