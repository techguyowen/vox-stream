<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Dedicated Scripture Overlay</title>
    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    
    <!-- Google Fonts for High-End Broadcast Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Lora:ital,wght@0,600;0,700;1,400;1,600&family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600;700;800&family=Oswald:wght@500;700&family=Poppins:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-family: 'Lora', Georgia, serif;
            --font-size: 26px;
            --card-bg: rgba(15, 23, 42, 0.94);
            --border-color: rgba(245, 158, 11, 0.8);
            --accent-bar: linear-gradient(90deg, #F59E0B, #FBBF24, #D97706);
            --badge-bg: linear-gradient(135deg, #F59E0B, #D97706);
            --badge-text: #000000;
            --version-tag-bg: rgba(255, 255, 255, 0.12);
            --version-tag-color: #FBBF24;
            --text-color: #FFFBEB;
            --shadow-color: rgba(0, 0, 0, 0.75);
            --glow-color: rgba(245, 158, 11, 0.3);
            --progress-color: #F59E0B;
        }

        /* Card Themes */
        body.theme-blue {
            --card-bg: rgba(15, 23, 42, 0.95);
            --border-color: rgba(59, 130, 246, 0.85);
            --accent-bar: linear-gradient(90deg, #2563EB, #38BDF8, #60A5FA);
            --badge-bg: linear-gradient(135deg, #2563EB, #0284C7);
            --badge-text: #FFFFFF;
            --version-tag-bg: rgba(56, 189, 248, 0.18);
            --version-tag-color: #38BDF8;
            --text-color: #F0F9FF;
            --glow-color: rgba(56, 189, 248, 0.3);
            --progress-color: #38BDF8;
        }

        body.theme-dark {
            --card-bg: rgba(0, 0, 0, 0.96);
            --border-color: rgba(255, 255, 255, 0.35);
            --accent-bar: linear-gradient(90deg, #52525B, #A1A1AA, #52525B);
            --badge-bg: #FFFFFF;
            --badge-text: #000000;
            --version-tag-bg: rgba(255, 255, 255, 0.15);
            --version-tag-color: #E4E4E7;
            --text-color: #FFFFFF;
            --glow-color: rgba(0, 0, 0, 0.8);
            --progress-color: #FFFFFF;
        }

        body.theme-light {
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: rgba(217, 119, 6, 0.7);
            --accent-bar: linear-gradient(90deg, #D97706, #F59E0B, #B45309);
            --badge-bg: linear-gradient(135deg, #D97706, #B45309);
            --badge-text: #FFFFFF;
            --version-tag-bg: rgba(0, 0, 0, 0.08);
            --version-tag-color: #B45309;
            --text-color: #1E293B;
            --shadow-color: rgba(0, 0, 0, 0.25);
            --glow-color: rgba(217, 119, 6, 0.2);
            --progress-color: #D97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            overflow: hidden;
            font-family: var(--font-family);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 40px;
            transition: all 0.3s ease;
        }

        body.align-top {
            align-items: flex-start;
            padding-bottom: 0;
            padding-top: 40px;
        }

        /* Dedicated Scripture Lower-Third Card */
        .scripture-container {
            width: 100%;
            max-width: min(1300px, 90vw);
            margin: 0 auto;
            position: relative;
            z-index: 100;
            perspective: 1000px;
        }

        .scripture-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 20px 30px;
            box-shadow: 0 16px 45px var(--shadow-color), 0 0 30px var(--glow-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .scripture-card.hidden {
            opacity: 0;
            transform: translateY(30px) scale(0.97);
            pointer-events: none;
        }

        body.align-top .scripture-card.hidden {
            transform: translateY(-30px) scale(0.97);
        }

        /* Top Accent Bar */
        .scripture-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3.5px;
            background: var(--accent-bar);
        }

        .scripture-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .scripture-badge-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scripture-badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Inter', sans-serif;
        }

        .scripture-version-tag {
            background: var(--version-tag-bg);
            color: var(--version-tag-color);
            font-size: 12px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif;
        }

        .scripture-text {
            font-family: var(--font-family);
            font-size: var(--font-size);
            font-weight: 600;
            line-height: 1.45;
            color: var(--text-color);
            text-shadow: 1px 1px 4px var(--shadow-color);
            font-style: var(--font-style, normal);
            letter-spacing: 0.01em;
        }

        /* Auto-Dismiss Progress Bar */
        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3.5px;
            background: rgba(255, 255, 255, 0.08);
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--progress-color);
            width: 100%;
            transform-origin: left;
        }

        .welcome-hint {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 12px;
            color: var(--version-tag-color);
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="theme-amber">
    <div class="welcome-hint" id="welcomeHint" style="display: none;">
        📡 OBS Scripture Source Active (Waiting for passage...)
    </div>

    <div class="scripture-container">
        <div id="scripture-card" class="scripture-card hidden">
            <div class="scripture-header">
                <div class="scripture-badge-group">
                    <span class="scripture-badge" id="scripture-citation">📖 BIBLE PASSAGE</span>
                    <span class="scripture-version-tag" id="scripture-version">BSB</span>
                </div>
            </div>
            <div class="scripture-text" id="scripture-text"></div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <script>
        const scriptureCard = document.getElementById("scripture-card");
        const scriptureCitationEl = document.getElementById("scripture-citation");
        const scriptureVersionEl = document.getElementById("scripture-version");
        const scriptureTextEl = document.getElementById("scripture-text");
        const progressFill = document.getElementById("progress-fill");
        const welcomeHint = document.getElementById("welcomeHint");

        let scriptureTimer = null;
        let progressAnim = null;

        // Apply dynamic typography and theme settings
        function applyBibleStyles(cfg) {
            if (!cfg) return;
            const b = cfg.bible || {};
            
            if (b.font_family) {
                document.documentElement.style.setProperty('--font-family', b.font_family);
            }
            if (b.font_size) {
                document.documentElement.style.setProperty('--font-size', `${b.font_size}px`);
            }
            const italics = b.use_italics ? 'italic' : 'normal';
            document.documentElement.style.setProperty('--font-style', italics);
            
            const vAlign = b.vertical_align || 'bottom';
            const theme = b.card_theme || 'amber';
            document.body.className = `${vAlign === 'top' ? 'align-top ' : ''}theme-${theme}`;
        }

        // Fetch initial config
        async function fetchConfig() {
            try {
                const res = await fetch("/api/config");
                if (res.ok) {
                    const cfg = await res.json();
                    applyBibleStyles(cfg);
                }
            } catch (e) {
                console.warn("Could not fetch config:", e);
            }
        }
        fetchConfig();

        // Show welcome indicator if opened directly in browser tab (outside OBS)
        const isObs = window.obsStudio !== undefined || navigator.userAgent.includes("OBS");
        if (!isObs && welcomeHint) {
            welcomeHint.style.display = "block";
            setTimeout(() => { welcomeHint.style.display = "none"; }, 5000);
        }

        // Check for URL test params: e.g. /bible?preview=1
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has("preview")) {
            showScriptureVerse({
                citation: "John 3:16",
                version: "BSB",
                text: "For God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life.",
                duration_seconds: 30
            });
        }

        function showScriptureVerse(data) {
            if (!scriptureCard || !scriptureCitationEl || !scriptureTextEl) return;
            if (scriptureTimer) clearTimeout(scriptureTimer);
            if (progressAnim) progressAnim.cancel();

            scriptureCitationEl.textContent = `📖 ${data.citation || 'Scripture Passage'}`;
            if (scriptureVersionEl) scriptureVersionEl.textContent = data.version || 'BSB';
            scriptureTextEl.textContent = `"${data.text || ''}"`;
            scriptureCard.classList.remove("hidden");

            const dur = (parseFloat(data.duration_seconds) || 14.0) * 1000;

            // Animate progress bar
            if (progressFill) {
                progressFill.style.width = "100%";
                progressAnim = progressFill.animate([
                    { width: "100%" },
                    { width: "0%" }
                ], {
                    duration: dur,
                    easing: "linear"
                });
            }

            scriptureTimer = setTimeout(() => {
                dismissScriptureVerse();
            }, dur);
        }

        function dismissScriptureVerse() {
            if (scriptureTimer) clearTimeout(scriptureTimer);
            if (progressAnim) progressAnim.cancel();
            scriptureTimer = null;
            if (scriptureCard) {
                scriptureCard.classList.add("hidden");
            }
        }

        // Connect dedicated WebSocket listener
        function connectWs() {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log("Connected to VoxStream Scripture WebSocket");
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "scripture_verse") {
                        showScriptureVerse(data);
                    } else if (data.type === "scripture_dismiss") {
                        dismissScriptureVerse();
                    } else if (data.type === "config_update") {
                        applyBibleStyles(data.config);
                    }
                } catch (e) {
                    console.error("Error parsing WebSocket message:", e);
                }
            };

            ws.onclose = () => {
                console.warn("Scripture WebSocket closed. Reconnecting in 2s...");
                setTimeout(connectWs, 2000);
            };

            ws.onerror = (err) => {
                console.error("Scripture WebSocket error:", err);
                ws.close();
            };
        }

        connectWs();
    </script>
</body>
</html>
