<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VoxStream - Room Confidence Monitor</title>
    <!-- Progressive Web App (PWA) Meta & Icons -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VoxStream">
    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Lora:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600;700;800&family=Oswald:wght@500;600;700&family=Poppins:wght@600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'OpenDyslexic';
            src: url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/woff/OpenDyslexic-Regular.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/ttf/OpenDyslexic-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'OpenDyslexic';
            src: url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/woff/OpenDyslexic-Bold.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/ttf/OpenDyslexic-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --text-muted: #8E8E93;
            --interim-color: #93C5FD;
            --accent: #3B82F6;
            --success: #10B981;
            --card-bg: rgba(22, 27, 34, 0.95);
            --border: #30363D;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --font-size: 48px;
            --line-height: 1.45;
        }

        /* High Contrast Themes */
        body.theme-oled {
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --interim-color: #93C5FD;
        }
        body.theme-amber {
            --bg-color: #050505;
            --text-color: #FFB703;
            --interim-color: #FB8500;
            --text-muted: #8D7B48;
        }
        body.theme-slate {
            --bg-color: #0F172A;
            --text-color: #F8FAFC;
            --interim-color: #FBBF24;
            --text-muted: #64748B;
        }
        body.theme-light {
            --bg-color: #F8FAFC;
            --text-color: #0F172A;
            --interim-color: #2563EB;
            --text-muted: #94A3B8;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            letter-spacing: var(--letter-spacing, normal);
            word-spacing: var(--word-spacing, normal);
            line-height: var(--line-height, 1.45);
            font-style: var(--font-style, normal);
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Fully Responsive Top Header Bar */
        .header-bar {
            flex-shrink: 0;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            gap: 12px;
            z-index: 100;
            transition: transform 0.25s ease, opacity 0.25s ease, margin-top 0.25s ease;
        }

        .header-bar.hidden {
            display: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .brand-badge {
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: -0.1px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.25);
            white-space: nowrap;
            max-width: 170px;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }

        .status-pill.offline {
            background: rgba(239, 68, 68, 0.12);
            color: #EF4444;
            border-color: rgba(239, 68, 68, 0.25);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .clock-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .theme-select {
            background: #161B22;
            color: #F0F3F6;
            border: 1px solid var(--border);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            max-width: 100%;
        }

        .theme-select option {
            background: #161B22;
            color: #F0F3F6;
        }

        /* Main Scrolling Container with generous top/bottom safe padding */
        .stage-container {
            flex: 1 1 auto;
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 24px 28px calc(110px + env(safe-area-inset-bottom, 0px)) 28px;
            overscroll-behavior-y: contain;
            position: relative;
            box-sizing: border-box;
        }

        .stage-container::-webkit-scrollbar {
            width: 8px;
        }
        .stage-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .transcript-content {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 20px;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
            padding-bottom: 50px;
            transition: opacity 0.3s ease;
            box-sizing: border-box;
        }

        .transcript-content.faded {
            opacity: 0;
        }

        .caption-sentence {
            font-size: var(--font-size);
            line-height: var(--line-height);
            font-weight: 700;
            color: var(--text-color);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            opacity: 0.95;
            word-wrap: break-word;
            transition: opacity 0.2s ease;
        }

        .caption-sentence.previous {
            opacity: 0.45;
            font-weight: 600;
        }

        .caption-sentence.interim {
            color: var(--interim-color);
            opacity: 1;
            font-weight: 800;
        }

        .caption-sentence.interim::after {
            content: "▍";
            display: inline-block;
            margin-left: 6px;
            animation: blink 0.9s infinite;
            color: var(--interim-color);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .empty-indicator {
            text-align: center;
            color: var(--text-muted);
            font-size: calc(var(--font-size) * 0.55);
            font-weight: 600;
            padding: 60px 0;
        }

        /* Floating Controls & Non-Obtrusive Action Triggers */
        .top-toggle-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 250;
            background: rgba(15, 23, 42, 0.75);
            color: var(--text-color);
            border: 1px solid var(--border);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: none; /* Only shown when header is hidden */
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .top-toggle-btn.visible {
            display: flex;
        }

        .top-toggle-btn:hover {
            transform: scale(1.08);
            background: rgba(30, 41, 59, 0.95);
        }

        /* Floating 'Jump to Live' indicator - ONLY shown when scrolled up */
        .jump-live-btn {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            right: 20px;
            z-index: 250;
            background: #2563EB;
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(14px);
            transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.15s ease;
        }

        .jump-live-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .jump-live-btn:hover {
            background: #1D4ED8;
            transform: scale(1.04);
        }

        /* 📱 Responsive Tablet & Mobile Layouts */
        @media (max-width: 1050px) {
            .clock-display {
                display: none;
            }
        }

        @media (max-width: 820px) {
            :root {
                --font-size: 28px;
            }

            .header-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 8px 12px;
                gap: 8px;
            }

            .header-left {
                width: 100%;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
            }

            @media (max-width: 520px) {
                .brand-sub {
                    display: none;
                }
                .status-pill {
                    max-width: 140px;
                    font-size: 10.5px;
                    padding: 2px 6px;
                }
            }

            .header-right {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }

            .header-controls-row {
                grid-column: span 2;
                display: flex;
                gap: 6px;
                justify-content: space-between;
            }

            .header-controls-row .ctrl-btn,
            .header-controls-row .theme-select {
                flex: 1;
            }

            .stage-container {
                padding: 16px 16px calc(120px + env(safe-area-inset-bottom, 0px)) 16px;
            }

            .transcript-content {
                padding-bottom: 60px;
            }
        }

        /* Accessibility (a11y): Reduced Motion Media Query */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
            .prompter-box, .history-row {
                transition: none !important;
                animation: none !important;
            }
        }

        :focus-visible {
            outline: 2.5px solid #38BDF8 !important;
            outline-offset: 2px !important;
        }

    </style>
</head>
<body class="theme-oled">

    <!-- Header Navigation Bar -->
    <header class="header-bar" id="headerBar">
        <div class="header-left">
            <div class="brand-badge">
                <span>🎙️ VoxStream</span>
                <span class="brand-sub" style="opacity: 0.4;">|</span>
                <span class="brand-sub" style="font-weight: 600; color: var(--text-muted);">Stage Display</span>
            </div>
            <div class="status-pill" id="statusPill">
                <span class="status-dot"></span>
                <span id="statusText">LIVE</span>
            </div>
        </div>

        <div class="clock-display" id="clockDisplay">12:00:00 PM</div>

        <div class="header-right">
            <!-- Mode Selector: Scrollable History vs Live Prompter -->
            <select class="theme-select" id="displayModeSelect" title="Display Mode">
                <option value="scrollable" selected>📜 Scrollable History</option>
                <option value="live">⚡ Live Prompter (Auto-Fade)</option>
            </select>

            <!-- Language Track Selector -->
            <select class="theme-select" id="langSelect" title="Language Track">
                <option value="en" selected>🌐 English (Original)</option>
                <option value="es">🇪🇸 Spanish (Español)</option>
                <option value="fr">🇫🇷 French (Français)</option>
                <option value="de">🇩🇪 German (Deutsch)</option>
                <option value="pt">🇧🇷 Portuguese (Português)</option>
                <option value="it">🇮🇹 Italian (Italiano)</option>
                <option value="zh">🇨🇳 Chinese (中文)</option>
                <option value="ja">🇯🇵 Japanese (日本語)</option>
                <option value="ko">🇰🇷 Korean (한국어)</option>
                <option value="ru">🇷🇺 Russian (Русский)</option>
                <option value="ar">🇸🇦 Arabic (العربية)</option>
                <option value="hi">🇮🇳 Hindi (हिन्दी)</option>
                <option value="nl">🇳🇱 Dutch (Nederlands)</option>
                <option value="pl">🇵🇱 Polish (Polski)</option>
                <option value="sv">🇸🇪 Swedish (Svenska)</option>
                <option value="tr">🇹🇷 Turkish (Türkçe)</option>
                <option value="uk">🇺🇦 Ukrainian (Українська)</option>
                <option value="vi">🇻🇳 Vietnamese (Tiếng Việt)</option>
            </select>

            <!-- Compact Secondary Controls Row (Adapts cleanly on mobile) -->
            <div class="header-controls-row">
                <!-- Typography Selector -->
                <select class="theme-select" id="fontSelect" title="Typography / Font Family">
                    <option value="'Inter', system-ui, -apple-system, sans-serif" selected>Inter (Modern Sans)</option>
                    <option value="'OpenDyslexic', sans-serif">📖 OpenDyslexic (Accessibility)</option>
                    <option value="'Montserrat', sans-serif">Montserrat (Bold Clean)</option>
                    <option value="'Poppins', sans-serif">Poppins (Smooth Rounded)</option>
                    <option value="'Oswald', sans-serif">Oswald (Tall Condensed)</option>
                    <option value="'Roboto', sans-serif">Roboto (Neutral Clean)</option>
                    <option value="'Open Sans', sans-serif">Open Sans (High Legibility)</option>
                    <option value="'Bebas Neue', sans-serif">Bebas Neue (Stage Headline)</option>
                    <option value="'Lora', Georgia, serif">Lora (Editorial Serif)</option>
                    <option value="'JetBrains Mono', monospace">JetBrains Mono (Monospace)</option>
                    <option value="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">System Default</option>
                </select>

                <!-- 1-Click Accessibility & Dyslexia Mode Toggle -->
                <label class="ctrl-btn-label" title="Toggle Visual Aid Spacing: Expanded letter tracking (0.06em), word spacing (0.15em), and line height (1.65x) for reading ease" style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.5); border-radius: 6px; padding: 4px 10px; font-size: 12.5px; font-weight: 700; color: #38BDF8; white-space: nowrap; user-select: none;">
                    <input type="checkbox" id="chkDisplayA11y" style="cursor: pointer; width: 16px; height: 16px;">
                    <span>👁️ Visual Aid Mode</span>
                </label>

                <!-- Theme Selector -->
                <select class="theme-select" id="themeSelect">
                    <option value="theme-oled" selected>🌑 Dark</option>
                    <option value="theme-amber">🟡 Amber</option>
                    <option value="theme-slate">🌌 Slate</option>
                    <option value="theme-light">☀️ Light</option>
                </select>

                <!-- Font Size Controls -->
                <button class="ctrl-btn" id="btnFontDec" title="Decrease font size (-)">A-</button>
                <button class="ctrl-btn" id="btnFontInc" title="Increase font size (+)">A+</button>

                <!-- Fullscreen -->
                <button class="ctrl-btn" id="btnInstallPwa" style="display: none;" title="Install VoxStream as Standalone App">📲 Install</button>
                <button class="ctrl-btn" id="btnFullscreen" title="Toggle Fullscreen (F11)">⛶</button>

                <!-- Clear Screen -->
                <button class="ctrl-btn" id="btnClear" title="Clear Screen History">🗑️</button>
                <button class="ctrl-btn" id="btnCollapseHeader" title="Hide Header Bar (H)">▲</button>
            </div>
        </div>
    </header>

    <!-- Live Scripture Prompter Card (Stage & Confidence Monitor) -->
    <div id="scripturePrompterCard" style="display: none; background: rgba(245, 158, 11, 0.12); border: 2px solid #F59E0B; border-radius: 10px; padding: 16px 20px; margin: 12px 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); backdrop-filter: blur(8px);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="background: #F59E0B; color: #000; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.04em;" id="stageScriptureCitation">📖 SCRIPTURE PASSAGE</span>
            <button type="button" id="btnDismissStageScripture" style="background: none; border: none; color: #F59E0B; font-size: 18px; font-weight: bold; cursor: pointer; padding: 0 6px;" title="Dismiss Scripture Card">✕</button>
        </div>
        <div style="font-size: 26px; font-weight: 700; color: #FEF3C7; line-height: 1.45; font-style: italic;" id="stageScriptureText">...</div>
    </div>

    <!-- Main Scrolling Area -->
    <main class="stage-container" id="stageContainer">
        <div class="transcript-content" id="transcriptContent">
            <div class="empty-indicator" id="emptyNotice">
                Listening for speech... Captions will appear here in real-time.
            </div>
        </div>
    </main>

    <!-- Non-obtrusive Floating Buttons -->
    <!-- 1. Top-Right Settings Gear (Only visible when header is collapsed) -->
    <button class="top-toggle-btn" id="btnToggleHeader" title="Show Header Controls (H)">⚙️</button>

    <!-- 2. Smart 'Jump to Live' Pill (Only visible when scrolled up) -->
    <button class="jump-live-btn" id="btnScrollBottom" title="Jump to Latest Live Speech">⬇️ Jump to Live</button>

    <script>
        // Screen & State
        const isMobile = window.innerWidth <= 768;
        const defaultFontSize = isMobile ? 28 : 48;
        let currentFontSize = defaultFontSize;

        // URL & Preference State
        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = urlParams.get('lang') || localStorage.getItem('voxstream_display_lang') || 'en';
        let currentMode = urlParams.get('mode') || localStorage.getItem('voxstream_display_mode') || 'scrollable';

        // In 'scrollable' mode we retain up to 300 sentences for scrolling back; in 'live' mode only 2 active lines
        let maxHistorySentences = (currentMode === 'live') ? 2 : 300;

        let finalSentences = [];
        let interimText = "";
        let ws = null;
        let autoScroll = true;
        let silenceHideTimer = null;

        // DOM Elements
        const stageContainer = document.getElementById('stageContainer');
        const transcriptContent = document.getElementById('transcriptContent');
        const clockDisplay = document.getElementById('clockDisplay');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');
        const displayModeSelect = document.getElementById('displayModeSelect');
        const langSelect = document.getElementById('langSelect');
        const fontSelect = document.getElementById('fontSelect');
        const themeSelect = document.getElementById('themeSelect');
        const headerBar = document.getElementById('headerBar');

        // Mode Selector: Scrollable History vs Live Prompter
        if (displayModeSelect) {
            displayModeSelect.value = currentMode;
            displayModeSelect.addEventListener('change', async (e) => {
                currentMode = e.target.value;
                localStorage.setItem('voxstream_display_mode', currentMode);

                if (currentMode === 'live') {
                    maxHistorySentences = 2;
                    while (finalSentences.length > 2) finalSentences.shift();
                    renderCaptions();
                } else {
                    maxHistorySentences = 300;
                    if (transcriptContent) transcriptContent.classList.remove('faded');
                    await loadInitialHistory();
                }
            });
        }

        // Language Selector
        if (langSelect) {
            langSelect.value = currentLang;
            langSelect.addEventListener('change', async (e) => {
                const newLang = e.target.value;
                currentLang = newLang;
                localStorage.setItem('voxstream_display_lang', currentLang);

                const newUrl = currentLang === 'en'
                    ? window.location.pathname
                    : `${window.location.pathname}?lang=${encodeURIComponent(currentLang)}`;
                window.history.replaceState(null, '', newUrl);

                if (finalSentences.length > 0 && currentLang !== 'en') {
                    const translatedList = await Promise.all(finalSentences.map(async (sentence) => {
                        try {
                            const res = await fetch(`/api/translate?text=${encodeURIComponent(sentence)}&target=${encodeURIComponent(currentLang)}`);
                            if (res.ok) {
                                const data = await res.json();
                                return data.translated || sentence;
                            }
                        } catch (err) {}
                        return sentence;
                    }));
                    finalSentences = translatedList;
                    renderCaptions();
                }

                if (ws) {
                    ws.onclose = null;
                    ws.close();
                }
                connectWebSocket();
            });
        }

        // Live Clock
        function updateClock() {
            if (!clockDisplay) return;
            const now = new Date();
            clockDisplay.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Font Size & Family Controls
        function setFontSize(size) {
            if (!Number.isFinite(size)) size = defaultFontSize;
            currentFontSize = Math.max(18, Math.min(96, size));
            document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
            localStorage.setItem('voxstream_display_fontsize', currentFontSize);
        }

        function setFontFamily(font) {
            document.documentElement.style.setProperty('--font-family', font);
            localStorage.setItem('voxstream_display_font', font);
            if (fontSelect) fontSelect.value = font;
        }

        const savedSize = localStorage.getItem('voxstream_display_fontsize');
        if (savedSize) {
            setFontSize(parseInt(savedSize));
        } else {
            setFontSize(defaultFontSize);
        }

        const savedFont = localStorage.getItem('voxstream_display_font');
        if (savedFont) setFontFamily(savedFont);

        function setTheme(theme) {
            if (!theme || !/^theme-[a-z]+$/.test(theme)) return;
            document.body.classList.forEach(c => {
                if (c.startsWith('theme-')) document.body.classList.remove(c);
            });
            document.body.classList.add(theme);
            if (themeSelect) themeSelect.value = theme;
        }

        const savedTheme = localStorage.getItem('voxstream_display_theme');
        if (savedTheme) setTheme(savedTheme);

        if (fontSelect) {
            fontSelect.addEventListener('change', (e) => {
                setFontFamily(e.target.value);
            });
        }

        if (themeSelect) {
            themeSelect.addEventListener('change', (e) => {
                setTheme(e.target.value);
                localStorage.setItem('voxstream_display_theme', e.target.value);
            });
        }

        // 1-Click Accessibility & Dyslexia Mode Toggle Handler
        const chkDisplayA11y = document.getElementById("chkDisplayA11y");

        function applyDisplayA11yMode(enabled) {
            if (enabled) {
                document.documentElement.style.setProperty("--letter-spacing", "0.06em");
                document.documentElement.style.setProperty("--word-spacing", "0.15em");
                document.documentElement.style.setProperty("--line-height", "1.65");
                document.documentElement.style.setProperty("--font-style", "normal");
            } else {
                document.documentElement.style.setProperty("--letter-spacing", "normal");
                document.documentElement.style.setProperty("--word-spacing", "normal");
                document.documentElement.style.setProperty("--line-height", "1.45");
                document.documentElement.style.setProperty("--font-style", "normal");
            }
            try {
                localStorage.setItem("voxstream_display_a11y", enabled ? "true" : "false");
            } catch(e) {}
        }

        if (chkDisplayA11y) {
            try {
                const savedA11y = localStorage.getItem("voxstream_display_a11y") === "true";
                if (savedA11y) {
                    chkDisplayA11y.checked = true;
                    applyDisplayA11yMode(true);
                }
            } catch(e) {}

            chkDisplayA11y.addEventListener("change", (e) => {
                applyDisplayA11yMode(e.target.checked);
            });
        }

        // Action Buttons
        const btnFontInc = document.getElementById('btnFontInc');
        if (btnFontInc) btnFontInc.addEventListener('click', () => setFontSize(currentFontSize + 4));

        const btnFontDec = document.getElementById('btnFontDec');
        if (btnFontDec) btnFontDec.addEventListener('click', () => setFontSize(currentFontSize - 4));
        
        const btnClear = document.getElementById('btnClear');
        if (btnClear) {
            btnClear.addEventListener('click', () => {
                finalSentences = [];
                interimText = "";
                renderCaptions();
            });
        }

        const btnFullscreen = document.getElementById('btnFullscreen');
        if (btnFullscreen) {
            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            });
        }

        const btnToggleHeader = document.getElementById('btnToggleHeader');
        const btnCollapseHeader = document.getElementById('btnCollapseHeader');
        const btnScrollBottom = document.getElementById('btnScrollBottom');

        function updateFloatingButtons() {
            // 1. Settings Gear: Show at top-right ONLY when top header bar is collapsed
            if (btnToggleHeader && headerBar) {
                if (headerBar.classList.contains('hidden')) {
                    btnToggleHeader.classList.add('visible');
                } else {
                    btnToggleHeader.classList.remove('visible');
                }
            }

            // 2. Jump to Live Button: Show at bottom-right ONLY when scrolled up away from live captions
            if (btnScrollBottom) {
                if (!autoScroll) {
                    btnScrollBottom.classList.add('visible');
                } else {
                    btnScrollBottom.classList.remove('visible');
                }
            }
        }

        if (btnToggleHeader && headerBar) {
            btnToggleHeader.addEventListener('click', () => {
                headerBar.classList.remove('hidden');
                updateFloatingButtons();
            });
        }

        if (btnCollapseHeader && headerBar) {
            btnCollapseHeader.addEventListener('click', () => {
                headerBar.classList.add('hidden');
                updateFloatingButtons();
            });
        }

        if (btnScrollBottom) {
            btnScrollBottom.addEventListener('click', () => {
                autoScroll = true;
                scrollToBottom();
                updateFloatingButtons();
            });
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            const tag = (e.target && e.target.tagName) || '';
            if (['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(tag)) return;
            if (e.key === '+' || e.key === '=') setFontSize(currentFontSize + 4);
            if (e.key === '-' || e.key === '_') setFontSize(currentFontSize - 4);
            if (e.key === 'h' || e.key === 'H') {
                if (headerBar) { headerBar.classList.toggle('hidden'); updateFloatingButtons(); }
            }
            if (e.key === 'c' || e.key === 'C') {
                finalSentences = [];
                interimText = "";
                renderCaptions();
            }
        });

        // Silence Timer handling for Live Prompter mode
        function triggerSilenceTimer() {
            if (silenceHideTimer) clearTimeout(silenceHideTimer);
            if (currentMode === 'live') {
                silenceHideTimer = setTimeout(() => {
                    if (transcriptContent) transcriptContent.classList.add('faded');
                }, 4000);
            }
        }

        function wakeLiveDisplay() {
            if (silenceHideTimer) {
                clearTimeout(silenceHideTimer);
                silenceHideTimer = null;
            }
            if (transcriptContent) {
                transcriptContent.classList.remove('faded');
            }
        }

        // Render Captions
        function renderCaptions() {
            if (!transcriptContent) return;

            if (finalSentences.length === 0 && !interimText) {
                transcriptContent.innerHTML = '<div class="empty-indicator">Listening for speech... Captions will appear here in real-time.</div>';
                return;
            }

            const emptyEl = transcriptContent.querySelector('.empty-indicator');
            if (emptyEl) {
                transcriptContent.innerHTML = '';
            }

            const existingFinals = transcriptContent.querySelectorAll('.caption-sentence:not(.interim)');
            if (existingFinals.length !== finalSentences.length) {
                let html = '';
                const count = finalSentences.length;
                finalSentences.forEach((sentence, idx) => {
                    const isRecent = idx >= count - 2;
                    const cls = isRecent ? 'caption-sentence' : 'caption-sentence previous';
                    html += `<div class="${cls}">${escapeHtml(sentence)}</div>`;
                });
                
                const interimNode = transcriptContent.querySelector('.interim');
                transcriptContent.innerHTML = html;
                if (interimNode) {
                    transcriptContent.appendChild(interimNode);
                }
            } else {
                const count = finalSentences.length;
                existingFinals.forEach((el, idx) => {
                    if (el.textContent !== finalSentences[idx]) {
                        el.textContent = finalSentences[idx];
                    }
                    const isRecent = idx >= count - 2;
                    const expectedCls = isRecent ? 'caption-sentence' : 'caption-sentence previous';
                    if (el.className !== expectedCls) {
                        el.className = expectedCls;
                    }
                });
            }

            let interimNode = transcriptContent.querySelector('.interim');
            if (interimText) {
                if (!interimNode) {
                    interimNode = document.createElement('div');
                    interimNode.className = 'caption-sentence interim';
                    transcriptContent.appendChild(interimNode);
                }
                if (interimNode.textContent !== interimText) {
                    interimNode.textContent = interimText;
                }
            } else if (interimNode) {
                interimNode.remove();
            }

            if (autoScroll) {
                scrollToBottom();
            }
        }

        function scrollToBottom() {
            if (stageContainer) {
                stageContainer.scrollTop = stageContainer.scrollHeight;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        if (stageContainer) {
            stageContainer.addEventListener('scroll', () => {
                const dist = stageContainer.scrollHeight - stageContainer.scrollTop - stageContainer.clientHeight;
                autoScroll = dist < 60;
                updateFloatingButtons();
            }, { passive: true });
        }

        // WebSocket Connection
        let reconnectAttempts = 0;
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?lang=${encodeURIComponent(currentLang || 'en')}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                reconnectAttempts = 0;
                if (statusPill) statusPill.classList.remove('offline');
                if (statusText) statusText.textContent = 'LIVE';
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "scripture_verse") {
                        showStageScripture(data);
                        return;
                    } else if (data.type === "scripture_dismiss") {
                        dismissStageScripture();
                        return;
                    }
                    handleCaptionEvent(data);
                } catch (err) {
                    console.error('Error parsing caption event:', err);
                }
            };

            ws.onclose = () => {
                if (statusPill) statusPill.classList.add('offline');
                if (statusText) statusText.textContent = 'RECONNECTING';
                setTimeout(connectWebSocket, Math.min(10000, (++reconnectAttempts) * 1500));
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        function handleCaptionEvent(data) {
            if (data.type === 'snapshot') {
                if (data.lines && data.lines.length > 0) {
                    finalSentences = [];
                    interimText = "";
                    for (const line of data.lines) {
                        const t = (line.text || '').trim();
                        if (t) finalSentences.push(t);
                    }
                    while (finalSentences.length > maxHistorySentences) finalSentences.shift();
                    renderCaptions();
                }
                return;
            }

            const text = (data.text || '').trim();

            if (data.is_final) {
                if (text) {
                    wakeLiveDisplay();
                    finalSentences.push(text);
                    while (finalSentences.length > maxHistorySentences) {
                        finalSentences.shift();
                    }
                    triggerSilenceTimer();
                } else {
                    if (currentMode === 'live') {
                        if (transcriptContent) transcriptContent.classList.add('faded');
                    }
                }
                interimText = "";
            } else {
                if (text) {
                    wakeLiveDisplay();
                }
                interimText = text;
            }

            renderCaptions();
        }

        // Initial history loader
        async function loadInitialHistory() {
            try {
                const limit = (currentMode === 'live') ? 2 : 100;
                const res = await fetch(`/api/transcript/history?limit=${limit}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.history && data.history.length > 0) {
                        finalSentences = [];
                        const items = [...data.history].reverse();
                        for (const item of items) {
                            const raw = (item.text || '').trim();
                            if (raw) finalSentences.push(raw);
                        }
                        while (finalSentences.length > maxHistorySentences) finalSentences.shift();
                        renderCaptions();
                    }
                }
            } catch(e) {}
        }

        connectWebSocket();
        loadInitialHistory();

        function formatEngineBadge(engine, engineName) {
            const raw = (engineName || engine || '').toLowerCase();
            if (raw.includes('google_web') || raw.includes('google speech') || raw.includes('free')) return 'Google';
            if (raw.includes('google_stt') || raw.includes('google cloud')) return 'Cloud STT';
            if (raw.includes('gemini')) return 'Gemini';
            if (raw.includes('moonshine')) return 'Moonshine';
            if (raw.includes('whisper')) return 'Whisper';
            if (raw.includes('vosk')) return 'Vosk';
            if (raw.includes('bandwidth')) return 'Bandwidth';
            let clean = (engineName || engine || 'Active').split('(')[0].trim();
            if (clean.length > 10) clean = clean.substring(0, 10);
            return clean;
        }

        async function updateDisplayStatus() {
            try {
                const res = await fetch('/api/status');
                if (res.ok) {
                    const data = await res.json();
                    if (statusText && ws && ws.readyState === WebSocket.OPEN) {
                        if (data.is_switching_engine) {
                            statusText.textContent = `⏳ DOWNLOADING...`;
                            if (statusPill) {
                                statusPill.style.background = "rgba(245, 158, 11, 0.15)";
                                statusPill.style.color = "#F59E0B";
                                statusPill.style.borderColor = "rgba(245, 158, 11, 0.35)";
                                statusPill.title = data.engine_switch_status || "Downloading speech recognition model...";
                            }
                        } else {
                            const shortEngine = formatEngineBadge(data.engine, data.engine_name);
                            statusText.textContent = `LIVE • ${shortEngine}`;
                            if (statusPill) {
                                statusPill.style.background = "rgba(16, 185, 129, 0.12)";
                                statusPill.style.color = "var(--success)";
                                statusPill.style.borderColor = "rgba(16, 185, 129, 0.25)";
                                statusPill.title = `Active Engine: ${data.engine_name || data.engine} | Uptime: ${data.uptime_seconds || 0}s`;
                            }
                        }
                    }
                }
            } catch (e) {}
        }
        updateDisplayStatus();
        updateFloatingButtons();
        setInterval(updateDisplayStatus, 5000);

        // --- Progressive Web App (PWA) & Screen Wake Lock ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }

        // Screen Wake Lock API (keeps iPad/phone screen active on stage)
        let wakeLock = null;
        let isRequestingWakeLock = false;
        async function requestScreenWakeLock() {
            if (!('wakeLock' in navigator) || wakeLock || isRequestingWakeLock) return;
            try {
                isRequestingWakeLock = true;
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (err) {
                // Ignore silent wake lock rejections on inactive tabs
            } finally {
                isRequestingWakeLock = false;
            }
        }
        requestScreenWakeLock();
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestScreenWakeLock();
        });
        window.addEventListener('click', () => { if (!wakeLock) requestScreenWakeLock(); });
        window.addEventListener('touchstart', () => { if (!wakeLock) requestScreenWakeLock(); });

        // 1-Click Install App Prompt
        let deferredInstallPrompt = null;
        const btnInstallPwa = document.getElementById('btnInstallPwa');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            if (btnInstallPwa) btnInstallPwa.style.display = 'inline-flex';
        });

        if (btnInstallPwa) {
            btnInstallPwa.addEventListener('click', async () => {
                if (deferredInstallPrompt) {
                    deferredInstallPrompt.prompt();
                    const { outcome } = await deferredInstallPrompt.userChoice;
                    if (outcome === 'accepted') {
                        btnInstallPwa.style.display = 'none';
                    }
                    deferredInstallPrompt = null;
                }
            });
        }

        window.addEventListener('appinstalled', () => {
            if (btnInstallPwa) btnInstallPwa.style.display = 'none';
        });


        // Scripture Prompter Card Logic
        const scripturePrompterCard = document.getElementById("scripturePrompterCard");
        const stageScriptureCitation = document.getElementById("stageScriptureCitation");
        const stageScriptureText = document.getElementById("stageScriptureText");
        const btnDismissStageScripture = document.getElementById("btnDismissStageScripture");
        let stageScriptureTimer = null;

        function showStageScripture(data) {
            if (!scripturePrompterCard) return;
            if (stageScriptureTimer) clearTimeout(stageScriptureTimer);
            
            stageScriptureCitation.textContent = `📖 ${data.citation || ''} • ${data.version || 'BSB'}`;
            stageScriptureText.textContent = `"${data.text || ''}"`;
            scripturePrompterCard.style.display = "block";
            
            const dur = (parseFloat(data.duration_seconds) || 16.0) * 1000;
            stageScriptureTimer = setTimeout(() => {
                dismissStageScripture();
            }, dur);
        }

        function dismissStageScripture() {
            if (stageScriptureTimer) clearTimeout(stageScriptureTimer);
            stageScriptureTimer = null;
            if (scripturePrompterCard) scripturePrompterCard.style.display = "none";
        }

        if (btnDismissStageScripture) {
            btnDismissStageScripture.addEventListener("click", dismissStageScripture);
        }

    </script>
</body>
</html>
