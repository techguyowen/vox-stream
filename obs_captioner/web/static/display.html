<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxStream - Room Confidence Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'OpenDyslexic';
            src: url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/woff/OpenDyslexic-Regular.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/ttf/OpenDyslexic-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'OpenDyslexic';
            src: url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/woff/OpenDyslexic-Bold.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/ttf/OpenDyslexic-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --text-muted: #8E8E93;
            --interim-color: #93C5FD;
            --accent: #3B82F6;
            --success: #10B981;
            --card-bg: rgba(22, 27, 34, 0.9);
            --border: #30363D;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --font-size: 48px;
            --line-height: 1.45;
        }

        /* High Contrast Themes */
        body.theme-oled {
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --interim-color: #93C5FD;
        }
        body.theme-amber {
            --bg-color: #050505;
            --text-color: #FFB703;
            --interim-color: #FB8500;
            --text-muted: #8D7B48;
        }
        body.theme-slate {
            --bg-color: #0F172A;
            --text-color: #F8FAFC;
            --interim-color: #FBBF24;
            --text-muted: #64748B;
        }
        body.theme-light {
            --bg-color: #F8FAFC;
            --text-color: #0F172A;
            --interim-color: #2563EB;
            --text-muted: #94A3B8;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Top Header Bar */
        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 58px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .header-bar.hidden {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-badge {
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: -0.1px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .status-pill.offline {
            background: rgba(239, 68, 68, 0.12);
            color: #EF4444;
            border-color: rgba(239, 68, 68, 0.25);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .clock-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: 0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .theme-select {
            background: #161B22;
            color: #F0F3F6;
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .theme-select option {
            background: #161B22;
            color: #F0F3F6;
        }

        /* Main Scrolling Container */
        .stage-container {
            position: absolute;
            top: 58px;
            bottom: 0;
            left: 0;
            right: 0;
            overflow-y: scroll;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 24px 40px 120px 40px;
            overscroll-behavior-y: contain;
        }

        .stage-container::-webkit-scrollbar {
            width: 8px;
        }
        .stage-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .transcript-content {
            min-height: calc(100% - 40px);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 20px;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
        }

        .caption-sentence {
            font-size: var(--font-size);
            line-height: var(--line-height);
            font-weight: 700;
            color: var(--text-color);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            opacity: 0.95;
            word-wrap: break-word;
            transition: opacity 0.2s ease;
        }

        .caption-sentence.previous {
            opacity: 0.5;
            font-weight: 600;
        }

        .caption-sentence.interim {
            color: var(--interim-color);
            opacity: 1;
            font-weight: 800;
        }

        .caption-sentence.interim::after {
            content: "▍";
            display: inline-block;
            margin-left: 6px;
            animation: blink 0.9s infinite;
            color: var(--interim-color);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .empty-indicator {
            text-align: center;
            color: var(--text-muted);
            font-size: calc(var(--font-size) * 0.6);
            font-weight: 600;
            padding: 100px 0;
        }

        /* Floating Auto-Scroll / Controls Button */
        .floating-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .float-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .float-btn:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.15);
        }

        
        /* Full History Drawer / Modal */
        .history-modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .history-modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .history-drawer {
            width: 100%;
            max-width: 540px;
            height: 100%;
            background: var(--card-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.5);
            transform: translateX(100%);
            transition: transform 0.25s ease;
        }

        .history-modal-backdrop.active .history-drawer {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .drawer-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drawer-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .drawer-close-btn:hover {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.1);
        }

        .drawer-search-bar {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .drawer-search-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .drawer-history-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 14px;
            line-height: 1.45;
        }

        .drawer-history-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .drawer-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        /* Mobile & Tablet Responsive Design */
        @media (max-width: 768px) {
            :root {
                --font-size: 26px;
            }

            .header-bar {
                height: auto;
                min-height: 52px;
                padding: 8px 12px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .clock-display {
                display: none; /* Hide clock on small mobile to give room to language & controls */
            }

            .brand-badge span:last-child {
                display: none;
            }

            .header-right {
                width: 100%;
                justify-content: space-between;
                overflow-x: auto;
                padding-bottom: 2px;
            }

            .header-right select, .header-right button {
                font-size: 11.5px;
                padding: 5px 8px;
            }

            .stage-container {
                top: 86px;
                padding: 16px 16px 90px 16px;
            }

            .caption-sentence {
                font-size: var(--font-size);
                line-height: 1.4;
            }

            .floating-controls {
                bottom: calc(16px + env(safe-area-inset-bottom, 0px));
                right: 16px;
            }
        }
    </style>
</head>
<body class="theme-oled">

    <!-- Header Navigation Bar -->
    <header class="header-bar" id="headerBar">
        <div class="header-left">
            <div class="brand-badge">
                <span>🎙️ VoxStream</span>
                <span style="opacity: 0.4;">|</span>
                <span style="font-weight: 600; color: var(--text-muted);">Stage Display</span>
            </div>
            <div class="status-pill" id="statusPill">
                <span class="status-dot"></span>
                <span id="statusText">LIVE</span>
            </div>
        </div>

        <div class="clock-display" id="clockDisplay">12:00:00 PM</div>

        <div class="header-right">
            <!-- Language Track Selector -->
            <select class="theme-select" id="langSelect" title="Language Track">
                <option value="en" selected>English (Original)</option>
                <option value="es">Spanish (Español)</option>
                <option value="fr">French (Français)</option>
                <option value="de">German (Deutsch)</option>
                <option value="pt">Portuguese (Português)</option>
                <option value="it">Italian (Italiano)</option>
                <option value="zh">Chinese (中文)</option>
                <option value="ja">Japanese (日本語)</option>
                <option value="ko">Korean (한국어)</option>
                <option value="ru">Russian (Русский)</option>
                <option value="ar">Arabic (العربية)</option>
                <option value="hi">Hindi (हिन्दी)</option>
                <option value="nl">Dutch (Nederlands)</option>
                <option value="pl">Polish (Polski)</option>
                <option value="sv">Swedish (Svenska)</option>
                <option value="tr">Turkish (Türkçe)</option>
                <option value="uk">Ukrainian (Українська)</option>
                <option value="vi">Vietnamese (Tiếng Việt)</option>
            </select>

            <!-- Font Selector -->
            <select class="theme-select" id="fontSelect" title="Typography / Font Family">
                <option value="'Inter', system-ui, -apple-system, sans-serif" selected>Inter</option>
                <option value="'OpenDyslexic', sans-serif">OpenDyslexic</option>
                <option value="'Montserrat', sans-serif">Montserrat</option>
                <option value="'Poppins', sans-serif">Poppins</option>
                <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
            </select>

            <!-- History Length / Depth Selector -->
            <select class="theme-select" id="historySelect" title="History Length on Screen">
                <option value="20" selected>📜 History: 20 Lines</option>
                <option value="10">📜 History: 10 Lines</option>
                <option value="5">📜 History: 5 Lines</option>
                <option value="50">📜 History: 50 Lines</option>
                <option value="100">📜 History: 100 Lines</option>
                <option value="2">⚡ Live Only (2 Lines)</option>
                <option value="1">✨ Live Sentence Only</option>
            </select>

            <!-- Full History Modal Drawer Button -->
            <button class="ctrl-btn" id="btnToggleHistoryDrawer" title="Open Full Session Transcript Drawer">📜 Full History</button>

            <!-- Theme Selector -->
            <select class="theme-select" id="themeSelect">
                <option value="theme-oled" selected>🌑 OLED Black</option>
                <option value="theme-amber">🟡 Amber Stage</option>
                <option value="theme-slate">🌌 Slate Blue</option>
                <option value="theme-light">☀️ High Light</option>
            </select>

            <!-- Font Size Controls -->
            <button class="ctrl-btn" id="btnFontDec" title="Decrease font size (-)">A-</button>
            <button class="ctrl-btn" id="btnFontInc" title="Increase font size (+)">A+</button>

            <!-- Fullscreen -->
            <button class="ctrl-btn" id="btnFullscreen" title="Toggle Fullscreen (F11)">⛶ Fullscreen</button>

            <!-- Clear -->
            <button class="ctrl-btn" id="btnClear" title="Clear Screen History">🗑️ Clear</button>
        </div>
    </header>

    <!-- Main Scrolling Area -->
    <main class="stage-container" id="stageContainer">
        <div class="transcript-content" id="transcriptContent">
            <div class="empty-indicator" id="emptyNotice">
                Listening for speech... Captions will appear here in real-time.
            </div>
        </div>
    </main>

    
    <!-- Full History Slide-Over Drawer -->
    <div class="history-modal-backdrop" id="historyDrawerBackdrop">
        <div class="history-drawer">
            <div class="drawer-header">
                <div class="drawer-title">📜 Session Transcript History</div>
                <button class="drawer-close-btn" id="btnCloseHistoryDrawer" title="Close Drawer">✕</button>
            </div>
            <div class="drawer-search-bar">
                <input type="text" class="drawer-search-input" id="drawerSearchInput" placeholder="🔍 Search transcript..." />
                <button class="ctrl-btn" id="btnRefreshHistoryDrawer" title="Refresh Transcript">🔄</button>
            </div>
            <div class="drawer-body" id="drawerHistoryList">
                <div class="empty-indicator" style="padding: 40px 0; font-size: 14px;">Loading transcript history...</div>
            </div>
            <div class="drawer-footer">
                <button class="ctrl-btn" id="btnCopyFullHistory" style="flex: 1;">📋 Copy Transcript</button>
                <a href="/api/transcript/export?format=txt" download class="ctrl-btn" style="text-decoration: none;">💾 TXT</a>
                <a href="/api/transcript/export?format=srt" download class="ctrl-btn" style="text-decoration: none;">💾 SRT</a>
            </div>
        </div>
    </div>

    <!-- Floating Actions -->
    <div class="floating-controls">
        <button class="float-btn" id="btnToggleHeader" title="Toggle Header Bar">⚙️</button>
        <button class="float-btn" id="btnScrollBottom" title="Scroll to Latest Speech">⬇️</button>
    </div>

    <script>
        // Screen & State
        const isMobile = window.innerWidth <= 768;
        const defaultFontSize = isMobile ? 28 : 48;
        let currentFontSize = defaultFontSize;

        // URL & Preference state
        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = urlParams.get('lang') || localStorage.getItem('voxstream_display_lang') || 'en';
        let maxHistorySentences = parseInt(urlParams.get('history') || localStorage.getItem('voxstream_display_history_depth') || '20') || 20;

        let finalSentences = [];
        let interimText = "";
        let ws = null;
        let autoScroll = true;

        // DOM Elements
        const stageContainer = document.getElementById('stageContainer');
        const transcriptContent = document.getElementById('transcriptContent');
        const clockDisplay = document.getElementById('clockDisplay');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');
        const fontSelect = document.getElementById('fontSelect');
        const themeSelect = document.getElementById('themeSelect');
        const langSelect = document.getElementById('langSelect');
        const historySelect = document.getElementById('historySelect');
        const headerBar = document.getElementById('headerBar');
        const historyDrawerBackdrop = document.getElementById('historyDrawerBackdrop');
        const drawerHistoryList = document.getElementById('drawerHistoryList');
        const drawerSearchInput = document.getElementById('drawerSearchInput');

        // Language Selector
        if (langSelect) {
            langSelect.value = currentLang;
            langSelect.addEventListener('change', async (e) => {
                const newLang = e.target.value;
                currentLang = newLang;
                localStorage.setItem('voxstream_display_lang', currentLang);

                // Update URL parameter without reload
                const newUrl = currentLang === 'en'
                    ? window.location.pathname
                    : `${window.location.pathname}?lang=${encodeURIComponent(currentLang)}`;
                window.history.replaceState(null, '', newUrl);

                // Translate currently visible text immediately
                if (finalSentences.length > 0 && currentLang !== 'en') {
                    const translatedList = await Promise.all(finalSentences.map(async (sentence) => {
                        try {
                            const res = await fetch(`/api/translate?text=${encodeURIComponent(sentence)}&target=${encodeURIComponent(currentLang)}`);
                            if (res.ok) {
                                const data = await res.json();
                                return data.translated || sentence;
                            }
                        } catch (err) {}
                        return sentence;
                    }));
                    finalSentences = translatedList;
                    renderCaptions();
                }

                // Reconnect WebSocket cleanly to new language
                if (ws) {
                    ws.onclose = null;
                    ws.close();
                }
                connectWebSocket();
            });
        }

        // Live Clock
        function updateClock() {
            if (!clockDisplay) return;
            const now = new Date();
            clockDisplay.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Font Size & Family Controls
        function setFontSize(size) {
            if (!Number.isFinite(size)) size = defaultFontSize;
            currentFontSize = Math.max(18, Math.min(96, size));
            document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
            localStorage.setItem('voxstream_display_fontsize', currentFontSize);
        }

        function setFontFamily(font) {
            document.documentElement.style.setProperty('--font-family', font);
            localStorage.setItem('voxstream_display_font', font);
            if (fontSelect) fontSelect.value = font;
        }

        // Restore Saved Preferences
        const savedSize = localStorage.getItem('voxstream_display_fontsize');
        if (savedSize) {
            setFontSize(parseInt(savedSize));
        } else {
            setFontSize(defaultFontSize);
        }

        const savedFont = localStorage.getItem('voxstream_display_font');
        if (savedFont) setFontFamily(savedFont);

        function setTheme(theme) {
            if (!theme || !/^theme-[a-z]+$/.test(theme)) return;
            document.body.classList.forEach(c => {
                if (c.startsWith('theme-')) document.body.classList.remove(c);
            });
            document.body.classList.add(theme);
            if (themeSelect) themeSelect.value = theme;
        }

        const savedTheme = localStorage.getItem('voxstream_display_theme');
        if (savedTheme) setTheme(savedTheme);

        if (fontSelect) {
            fontSelect.addEventListener('change', (e) => {
                setFontFamily(e.target.value);
            });
        }

        if (themeSelect) {
            themeSelect.addEventListener('change', (e) => {
                setTheme(e.target.value);
                localStorage.setItem('voxstream_display_theme', e.target.value);
            });
        }

        // History Depth Selector
        if (historySelect) {
            historySelect.value = String(maxHistorySentences);
            historySelect.addEventListener('change', async (e) => {
                maxHistorySentences = parseInt(e.target.value) || 20;
                localStorage.setItem('voxstream_display_history_depth', maxHistorySentences);

                // Fetch new depth from history API if expanding
                if (maxHistorySentences > finalSentences.length) {
                    await loadInitialHistory();
                } else {
                    while (finalSentences.length > maxHistorySentences) {
                        finalSentences.shift();
                    }
                    renderCaptions();
                }
            });
        }

        // Full History Drawer Handlers
        async function loadDrawerHistory(searchQuery = "") {
            if (!drawerHistoryList) return;
            try {
                const res = await fetch(`/api/transcript/history?limit=250&search=${encodeURIComponent(searchQuery)}`);
                if (res.ok) {
                    const data = await res.json();
                    const entries = data.history || [];
                    if (entries.length === 0) {
                        drawerHistoryList.innerHTML = '<div class="empty-indicator" style="padding: 40px 0; font-size: 14px;">No transcript entries found.</div>';
                        return;
                    }
                    drawerHistoryList.innerHTML = entries.map(item => `
                        <div class="drawer-history-item">
                            <div class="drawer-history-time">[${escapeHtml(item.relative_time || '')}]</div>
                            <div>${escapeHtml(item.text || '')}</div>
                        </div>
                    `).join('');
                }
            } catch(e) {
                drawerHistoryList.innerHTML = '<div class="empty-indicator" style="padding: 40px 0; font-size: 14px;">Failed to load transcript history.</div>';
            }
        }

        const btnToggleHistoryDrawer = document.getElementById('btnToggleHistoryDrawer');
        if (btnToggleHistoryDrawer && historyDrawerBackdrop) {
            btnToggleHistoryDrawer.addEventListener('click', () => {
                historyDrawerBackdrop.classList.add('active');
                loadDrawerHistory(drawerSearchInput ? drawerSearchInput.value : '');
            });
        }

        const btnCloseHistoryDrawer = document.getElementById('btnCloseHistoryDrawer');
        if (btnCloseHistoryDrawer && historyDrawerBackdrop) {
            btnCloseHistoryDrawer.addEventListener('click', () => {
                historyDrawerBackdrop.classList.remove('active');
            });
        }

        if (historyDrawerBackdrop) {
            historyDrawerBackdrop.addEventListener('click', (e) => {
                if (e.target === historyDrawerBackdrop) {
                    historyDrawerBackdrop.classList.remove('active');
                }
            });
        }

        if (drawerSearchInput) {
            drawerSearchInput.addEventListener('input', () => {
                loadDrawerHistory(drawerSearchInput.value);
            });
        }

        const btnRefreshHistoryDrawer = document.getElementById('btnRefreshHistoryDrawer');
        if (btnRefreshHistoryDrawer) {
            btnRefreshHistoryDrawer.addEventListener('click', () => {
                loadDrawerHistory(drawerSearchInput ? drawerSearchInput.value : '');
            });
        }

        const btnCopyFullHistory = document.getElementById('btnCopyFullHistory');
        if (btnCopyFullHistory) {
            btnCopyFullHistory.addEventListener('click', async () => {
                try {
                    const res = await fetch('/api/transcript/history?limit=500');
                    if (res.ok) {
                        const data = await res.json();
                        const lines = (data.history || []).map(e => `[${e.relative_time || ''}] ${e.text || ''}`);
                        await navigator.clipboard.writeText(lines.join('\n'));
                        btnCopyFullHistory.textContent = '✅ Copied!';
                        setTimeout(() => { btnCopyFullHistory.textContent = '📋 Copy Transcript'; }, 2000);
                    }
                } catch(e) {}
            });
        }

        // Action Buttons
        const btnFontInc = document.getElementById('btnFontInc');
        if (btnFontInc) btnFontInc.addEventListener('click', () => setFontSize(currentFontSize + 4));

        const btnFontDec = document.getElementById('btnFontDec');
        if (btnFontDec) btnFontDec.addEventListener('click', () => setFontSize(currentFontSize - 4));
        
        const btnClear = document.getElementById('btnClear');
        if (btnClear) {
            btnClear.addEventListener('click', () => {
                finalSentences = [];
                interimText = "";
                renderCaptions();
            });
        }

        const btnFullscreen = document.getElementById('btnFullscreen');
        if (btnFullscreen) {
            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            });
        }

        const btnToggleHeader = document.getElementById('btnToggleHeader');
        if (btnToggleHeader && headerBar) {
            btnToggleHeader.addEventListener('click', () => {
                headerBar.classList.toggle('hidden');
            });
        }

        const btnScrollBottom = document.getElementById('btnScrollBottom');
        if (btnScrollBottom) {
            btnScrollBottom.addEventListener('click', () => {
                autoScroll = true;
                scrollToBottom();
            });
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            const tag = (e.target && e.target.tagName) || '';
            if (['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(tag)) return;
            if (e.key === '+' || e.key === '=') setFontSize(currentFontSize + 4);
            if (e.key === '-' || e.key === '_') setFontSize(currentFontSize - 4);
            if (e.key === 'h' || e.key === 'H') {
                if (headerBar) headerBar.classList.toggle('hidden');
            }
            if (e.key === 'c' || e.key === 'C') {
                finalSentences = [];
                interimText = "";
                renderCaptions();
            }
        });

        // Render Captions
        function renderCaptions() {
            if (!transcriptContent) return;

            if (finalSentences.length === 0 && !interimText) {
                transcriptContent.innerHTML = '<div class="empty-indicator">Listening for speech... Captions will appear here in real-time.</div>';
                return;
            }

            const emptyEl = transcriptContent.querySelector('.empty-indicator');
            if (emptyEl) {
                transcriptContent.innerHTML = '';
            }

            const existingFinals = transcriptContent.querySelectorAll('.caption-sentence:not(.interim)');
            if (existingFinals.length !== finalSentences.length) {
                let html = '';
                const count = finalSentences.length;
                finalSentences.forEach((sentence, idx) => {
                    const isRecent = idx >= count - 2;
                    const cls = isRecent ? 'caption-sentence' : 'caption-sentence previous';
                    html += `<div class="${cls}">${escapeHtml(sentence)}</div>`;
                });
                
                const interimNode = transcriptContent.querySelector('.interim');
                transcriptContent.innerHTML = html;
                if (interimNode) {
                    transcriptContent.appendChild(interimNode);
                }
            } else {
                const count = finalSentences.length;
                existingFinals.forEach((el, idx) => {
                    if (el.textContent !== finalSentences[idx]) {
                        el.textContent = finalSentences[idx];
                    }
                    const isRecent = idx >= count - 2;
                    const expectedCls = isRecent ? 'caption-sentence' : 'caption-sentence previous';
                    if (el.className !== expectedCls) {
                        el.className = expectedCls;
                    }
                });
            }

            let interimNode = transcriptContent.querySelector('.interim');
            if (interimText) {
                if (!interimNode) {
                    interimNode = document.createElement('div');
                    interimNode.className = 'caption-sentence interim';
                    transcriptContent.appendChild(interimNode);
                }
                if (interimNode.textContent !== interimText) {
                    interimNode.textContent = interimText;
                }
            } else if (interimNode) {
                interimNode.remove();
            }

            if (autoScroll) {
                scrollToBottom();
            }
        }

        function scrollToBottom() {
            if (stageContainer) {
                stageContainer.scrollTop = stageContainer.scrollHeight;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        if (stageContainer) {
            stageContainer.addEventListener('scroll', () => {
                const dist = stageContainer.scrollHeight - stageContainer.scrollTop - stageContainer.clientHeight;
                autoScroll = dist < 60;
            }, { passive: true });
        }

        // WebSocket Connection
        let reconnectAttempts = 0;
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?lang=${encodeURIComponent(currentLang || 'en')}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                reconnectAttempts = 0;
                if (statusPill) statusPill.classList.remove('offline');
                if (statusText) statusText.textContent = 'LIVE';
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleCaptionEvent(data);
                } catch (err) {
                    console.error('Error parsing caption event:', err);
                }
            };

            ws.onclose = () => {
                if (statusPill) statusPill.classList.add('offline');
                if (statusText) statusText.textContent = 'RECONNECTING';
                setTimeout(connectWebSocket, Math.min(10000, (++reconnectAttempts) * 1500));
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        function handleCaptionEvent(data) {
            if (data.type === 'snapshot') {
                if (data.lines && data.lines.length > 0) {
                    finalSentences = [];
                    interimText = "";
                    for (const line of data.lines) {
                        const t = (line.text || '').trim();
                        if (t) finalSentences.push(t);
                    }
                    while (finalSentences.length > maxHistorySentences) finalSentences.shift();
                    renderCaptions();
                }
                return;
            }

            const text = (data.text || '').trim();

            if (data.is_final) {
                if (text) {
                    finalSentences.push(text);
                    if (finalSentences.length > maxHistorySentences) {
                        finalSentences.shift();
                    }
                }
                interimText = "";
            } else {
                interimText = text;
            }

            renderCaptions();
        }

        // Initial history loader
        async function loadInitialHistory() {
            try {
                const queryLimit = Math.max(15, maxHistorySentences);
                const res = await fetch(`/api/transcript/history?limit=${queryLimit}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.history && data.history.length > 0) {
                        finalSentences = [];
                        const items = [...data.history].reverse();
                        for (const item of items) {
                            const raw = (item.text || '').trim();
                            if (raw) finalSentences.push(raw);
                        }
                        while (finalSentences.length > maxHistorySentences) finalSentences.shift();
                        renderCaptions();
                    }
                }
            } catch(e) {}
        }

        connectWebSocket();
        loadInitialHistory();

        async function updateDisplayStatus() {
            try {
                const res = await fetch('/api/status');
                if (res.ok) {
                    const data = await res.json();
                    if (statusText && ws && ws.readyState === WebSocket.OPEN) {
                        statusText.textContent = `LIVE • ${data.engine_name || data.engine || 'Active'}`;
                    }
                }
            } catch (e) {}
        }
        updateDisplayStatus();
        setInterval(updateDisplayStatus, 5000);
    </script>
</body>
</html>
