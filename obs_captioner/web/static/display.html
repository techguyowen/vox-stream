<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VoxStream - Live Read-Along</title>
    <!-- Progressive Web App (PWA) Meta & Icons -->
    <link rel="manifest" href="/manifest-display.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Read-Along">
    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/static/icon-display.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-display-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon-display.png">
    <link rel="apple-touch-icon" href="/static/icon-display-192.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Lora:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600;700;800&family=Oswald:wght@500;600;700&family=Poppins:wght@600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'OpenDyslexic';
            src: url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/woff/OpenDyslexic-Regular.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/ttf/OpenDyslexic-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'OpenDyslexic';
            src: url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/woff/OpenDyslexic-Bold.woff') format('woff'),
                 url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/ttf/OpenDyslexic-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --text-muted: #8E8E93;
            --interim-color: #93C5FD;
            --accent: #3B82F6;
            --success: #10B981;
            --card-bg: rgba(22, 27, 34, 0.95);
            --border: #30363D;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --font-size: 48px;
            --line-height: 1.45;
        }

        /* High Contrast Themes */
        body.theme-oled {
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --interim-color: #93C5FD;
        }
        body.theme-amber {
            --bg-color: #050505;
            --text-color: #FFB703;
            --interim-color: #FB8500;
            --text-muted: #8D7B48;
        }
        body.theme-slate {
            --bg-color: #0F172A;
            --text-color: #F8FAFC;
            --interim-color: #FBBF24;
            --text-muted: #64748B;
        }
        body.theme-light {
            --bg-color: #F8FAFC;
            --text-color: #0F172A;
            --interim-color: #2563EB;
            --text-muted: #94A3B8;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border: #E2E8F0;
        }
        body.theme-high-vis {
            --bg-color: #000000;
            --text-color: #FFFF00;
            --interim-color: #FEF08A;
            --text-muted: #A3A3A3;
            --card-bg: #111111;
            --border: #FFFF00;
        }
        body.theme-pro-green {
            --bg-color: #051A14;
            --text-color: #34D399;
            --interim-color: #6EE7B7;
            --text-muted: #065F46;
            --border: #047857;
        }
        body.theme-hacker {
            --bg-color: #000000;
            --text-color: #00FF66;
            --interim-color: #66FF99;
            --text-muted: #008833;
            --border: #00AA44;
            --font-family: 'JetBrains Mono', monospace;
        }
        body.theme-dark {
            --bg-color: #0D1117;
            --text-color: #C9D1D9;
            --interim-color: #58A6FF;
            --text-muted: #8B949E;
            --card-bg: #161B22;
            --border: #30363D;
        }
        /* Base Reset & Fullscreen Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* FIX: html must also clamp to viewport to prevent gray sidebar bleed */
        html {
            width: 100%;
            max-width: 100vw;
            height: 100%;
            overflow: hidden;
        }

        body {
            width: 100%;
            max-width: 100vw;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            letter-spacing: var(--letter-spacing, normal);
            word-spacing: var(--word-spacing, normal);
            line-height: var(--line-height, 1.45);
            font-style: var(--font-style, normal);
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* -------------------------------------------------------------
           Header Navigation Bar (Rock-Solid Multi-Resolution Layout)
           ------------------------------------------------------------- */
        .header-bar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            flex-shrink: 0;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .header-bar.hidden {
            display: none !important;
        }

        .header-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .brand-badge {
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: -0.1px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.25);
            white-space: nowrap;
            max-width: 170px;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }

        .status-pill.offline {
            background: rgba(239, 68, 68, 0.12);
            color: #EF4444;
            border-color: rgba(239, 68, 68, 0.25);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .status-pill.offline .status-dot {
            background: #EF4444;
            box-shadow: 0 0 8px #EF4444;
        }

        .clock-display {
            font-size: 13.5px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .header-quick-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .header-controls-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .theme-select {
            background: #161B22;
            color: #F0F3F6;
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .theme-select:focus {
            border-color: #38BDF8;
        }

        /* Wide screens (>= 1150px): Place dropdowns cleanly inline */
        @media (min-width: 1150px) {
            .header-bar {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 8px 18px;
                gap: 16px;
            }
            .header-main-row {
                width: auto;
                justify-content: flex-start;
                gap: 16px;
            }
            .header-controls-row {
                width: auto;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .theme-select {
                width: auto;
                min-width: 160px;
            }
        }

        @media (max-width: 600px) {
            .brand-sub {
                display: none;
            }
            .clock-display {
                display: none;
            }
            .header-controls-row {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .theme-select {
                font-size: 11.5px;
                padding: 5px 6px;
            }
        }

        /* FIX: Scripture prompter card must not grow/squash the main caption area */
        #scripturePrompterCard {
            flex-shrink: 0;
        }

        /* -------------------------------------------------------------
           Stage Caption Container & Typography
           ------------------------------------------------------------- */
        .stage-container {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 32px 40px calc(48px + env(safe-area-inset-bottom, 0px)) 40px;
            box-sizing: border-box;
            width: 100%;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        }

        .stage-container::-webkit-scrollbar {
            width: 8px;
        }
        .stage-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .stage-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
        }
        .stage-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.45);
        }

        .transcript-content {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 100%;
            width: 100%;
            box-sizing: border-box;
            transition: opacity 0.35s ease;
        }

        /* FIX: Push content to bottom when few items exist, but allow upward scrolling when overflowing */
        .transcript-content::before {
            content: '';
            margin-top: auto;
            flex-shrink: 0;
        }

        .transcript-content.faded {
            opacity: 0;
        }

        /* ⚡ Bionic Reading / Saccadic Word Fixation */
        .bionic-fixation {
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: -0.01em;
        }
        body.theme-light .bionic-fixation {
            color: #000000;
        }
        body.theme-high-vis .bionic-fixation {
            color: #FFFF00;
        }
        body.theme-amber .bionic-fixation {
            color: #F59E0B;
        }

        /* Smooth Word Flow Animation for Reading Ease */
        .caption-sentence {
            font-size: var(--font-size);
            line-height: var(--line-height);
            font-weight: 700;
            color: var(--text-color);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            opacity: 0.95;
            word-wrap: break-word;
            overflow-wrap: break-word;
            transition: opacity 0.3s ease, color 0.3s ease;
            margin-bottom: 16px;
        }

        .caption-sentence.previous {
            opacity: 0.85;
            font-weight: 600;
        }

        body.mode-live .caption-sentence.previous {
            opacity: 0.38;
            font-weight: 600;
        }

        .caption-sentence.interim {
            color: var(--interim-color);
            opacity: 1;
            font-weight: 800;
        }

        .caption-sentence.interim::after {
            content: "▍";
            display: inline-block;
            margin-left: 6px;
            animation: blink 0.9s infinite;
            color: var(--interim-color);
        }

        /* Slow Flow Mode: Smooth word entry */
        .slow-flow-mode .caption-sentence {
            transition: all 0.4s ease;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .empty-indicator {
            text-align: center;
            color: var(--text-muted);
            font-size: calc(var(--font-size) * 0.55);
            font-weight: 600;
            padding: 60px 0;
            margin: auto 0;
        }

        /* Floating Controls */
        .top-toggle-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 250;
            background: rgba(15, 23, 42, 0.75);
            color: var(--text-color);
            border: 1px solid var(--border);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .top-toggle-btn.visible {
            display: flex;
        }

        .top-toggle-btn:hover {
            transform: scale(1.08);
            background: rgba(30, 41, 59, 0.95);
        }

        .jump-live-btn {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            right: 20px;
            z-index: 250;
            background: #2563EB;
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(14px);
            transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.15s ease;
        }

        .jump-live-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .jump-live-btn:hover {
            background: #1D4ED8;
            transform: scale(1.04);
        }

        /* Accessibility (a11y): Reduced Motion Media Query */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
            .prompter-box, .history-row {
                transition: none !important;
                animation: none !important;
            }
        }

        :focus-visible {
            outline: 2.5px solid #38BDF8 !important;
            outline-offset: 2px !important;
        }
    </style>
</head>
<body class="theme-oled">

    <!-- Header Navigation Bar -->
    <header class="header-bar" id="headerBar">
        <div class="header-main-row">
            <div class="header-left">
                <div class="brand-badge">
                    <span>🎙️ VoxStream</span>
                    <span class="brand-sub" style="opacity: 0.4;">|</span>
                    <span class="brand-sub" style="font-weight: 600; color: var(--text-muted);">Live Read-Along</span>
                </div>
                <div class="status-pill" id="statusPill">
                    <span class="status-dot"></span>
                    <span id="statusText">LIVE</span>
                </div>
            </div>

            <div class="clock-display" id="clockDisplay">12:00:00 PM</div>

            <div class="header-quick-actions">
                <button class="ctrl-btn" id="btnOpenSettings" title="Display &amp; Reading Settings (S)" aria-label="Settings" style="background: rgba(56, 189, 248, 0.18); border-color: rgba(56, 189, 248, 0.45); color: #38BDF8;">
                    ⚙️ <span class="settings-label" style="font-size: 11.5px; margin-left: 2px;">Settings</span>
                </button>
                <button class="ctrl-btn" id="btnFontDec" title="Decrease font size (-)" aria-label="Decrease Font Size">A-</button>
                <button class="ctrl-btn" id="btnFontInc" title="Increase font size (+)" aria-label="Increase Font Size">A+</button>
                <button class="ctrl-btn" id="btnFullscreen" title="Toggle Fullscreen (F11)" aria-label="Toggle Fullscreen">⛶</button>
                <button class="ctrl-btn" id="btnClear" title="Clear History (C)" aria-label="Clear History">🗑️</button>
                <button class="ctrl-btn" id="btnCollapseHeader" title="Hide Header Bar (H)" aria-label="Hide Header Bar">↑</button>
            </div>
        </div>

        <div class="header-controls-row">
            <!-- Mode Selector -->
            <select class="theme-select" id="displayModeSelect" title="Display Mode" aria-label="Display Mode">
                <option value="scrollable" selected>📜 Scrollable History</option>
                <option value="live">⚡ Live Prompter</option>
            </select>

            <!-- Language Selector -->
            <select class="theme-select" id="langSelect" title="Language Track" aria-label="Language Track">
                <option value="en" selected>🌐 English</option>
                <option value="es">🇪🇸 Spanish</option>
                <option value="fr">🇫🇷 French</option>
                <option value="de">🇩🇪 German</option>
                <option value="pt">🇧🇷 Portuguese</option>
                <option value="it">🇮🇹 Italian</option>
                <option value="zh">🇨🇳 Chinese</option>
                <option value="ja">🇯🇵 Japanese</option>
                <option value="ko">🇰🇷 Korean</option>
                <option value="ru">Русский</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>
                <option value="nl">Nederlands</option>
                <option value="pl">Polski</option>
                <option value="sv">Svenska</option>
                <option value="tr">Türkçe</option>
                <option value="uk">Українська</option>
                <option value="vi">Tiếng Việt</option>
            </select>
        </div>
    </header>

    <!-- Settings Modal (Full Reading Comfort, Typography & Theme Control) -->
    <div id="settingsModal" class="modal-backdrop" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);">
        <div class="modal-content" style="background: #111827; border: 1px solid rgba(255,255,255,0.18); border-radius: 16px; padding: 22px 24px; width: 92%; max-width: 460px; box-shadow: 0 24px 48px rgba(0,0,0,0.9); color: #F9FAFB; max-height: 90vh; overflow-y: auto;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 14px; margin-bottom: 16px;">
                <h3 style="margin: 0; font-size: 18px; font-weight: 700; color: #FFFFFF; display: flex; align-items: center; gap: 8px;">
                    <span>⚙️ Display &amp; Reading Settings</span>
                </h3>
                <button id="btnCloseSettings" style="background: none; border: none; color: #9CA3AF; font-size: 24px; font-weight: bold; cursor: pointer; padding: 0 6px; line-height: 1;">✕</button>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 16px;">
                
                <!-- SECTION 1: Visual Aid & Reading Comfort -->
                <div style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 14px;">
                    <div style="font-size: 11.5px; font-weight: 800; color: #93C5FD; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px;">
                        👁️ Reading Comfort &amp; Visual Aids
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <!-- Visual Aid Mode -->
                        <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.35); padding: 10px 12px; border-radius: 8px;">
                            <div>
                                <span style="font-size: 13.5px; font-weight: 700; color: #38BDF8; display: block;">👁️ Visual Aid Mode</span>
                                <span style="font-size: 11px; color: #94A3B8; display: block; margin-top: 2px;">Expanded letter spacing (0.06em), word spacing (0.15em), line height (1.65x)</span>
                            </div>
                            <input type="checkbox" id="chkDisplayA11y" style="width: 20px; height: 20px; cursor: pointer; accent-color: #38BDF8;">
                        </label>

                        <!-- Slow Down Text Mode -->
                        <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35); padding: 10px 12px; border-radius: 8px;">
                            <div>
                                <span style="font-size: 13.5px; font-weight: 700; color: #FBBF24; display: block;">🐢 Slow Down Text</span>
                                <span style="font-size: 11px; color: #94A3B8; display: block; margin-top: 2px;">Paces words steadily at 140 WPM and holds text on screen 3x longer</span>
                            </div>
                            <input type="checkbox" id="chkDisplayPacing" style="width: 20px; height: 20px; cursor: pointer; accent-color: #F59E0B;">
                        </label>

                        <!-- Bionic Reading Mode -->
                        <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.35); padding: 10px 12px; border-radius: 8px;">
                            <div>
                                <span style="font-size: 13.5px; font-weight: 700; color: #C084FC; display: block;">⚡ Bionic Reading (Guided Word Focus)</span>
                                <span style="font-size: 11px; color: #94A3B8; display: block; margin-top: 2px;">Bolds initial letters of each word for rapid eye fixation and ADHD focus</span>
                            </div>
                            <input type="checkbox" id="chkDisplayBionic" style="width: 20px; height: 20px; cursor: pointer; accent-color: #A855F7;">
                        </label>

                        <!-- Finalized Only Mode -->
                        <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.35); padding: 10px 12px; border-radius: 8px;">
                            <div>
                                <span style="font-size: 13.5px; font-weight: 700; color: #34D399; display: block;">✨ Final Sentences Only</span>
                                <span style="font-size: 11px; color: #94A3B8; display: block; margin-top: 2px;">Waits until speech is fully prepared &amp; punctuated. Completely hides live in-progress guessing.</span>

                            <input type="checkbox" id="chkDisplayFinalOnly" style="width: 20px; height: 20px; cursor: pointer; accent-color: #10B981;">
                        </label>

                </div>

                <!-- SECTION 2: Typography -->
                <div>
                    <label for="fontSelect" style="display: block; font-size: 12px; margin-bottom: 5px; color: #94A3B8; font-weight: 700;">🔤 Typography / Font Family</label>
                    <select class="theme-select" id="fontSelect" style="width: 100%; padding: 9px 12px; font-size: 13.5px;">
                        <option value="'Inter', system-ui, -apple-system, sans-serif" selected>Inter (Modern Sans)</option>
                        <option value="'OpenDyslexic', sans-serif">📖 OpenDyslexic (Dyslexia Aid)</option>
                        <option value="'Lexend', sans-serif">📖 Lexend (Readability)</option>
                        <option value="'Roboto', sans-serif">Roboto</option>
                        <option value="'Bebas Neue', sans-serif">Bebas Neue (Condensed Stage)</option>
                        <option value="'Oswald', sans-serif">Oswald (Bold Impact)</option>
                        <option value="'Montserrat', sans-serif">Montserrat (Geometric)</option>
                        <option value="'Poppins', sans-serif">Poppins (Rounded)</option>
                        <option value="'Lora', serif">Lora (Editorial Serif)</option>
                        <option value="'JetBrains Mono', monospace">JetBrains Mono (Monospace)</option>
                        <option value="'Open Sans', sans-serif">Open Sans</option>
                    </select>
                </div>

                <!-- SECTION 3: Color Theme -->
                <div>
                    <label for="themeSelect" style="display: block; font-size: 12px; margin-bottom: 5px; color: #94A3B8; font-weight: 700;">🎨 Color Theme</label>
                    <select class="theme-select" id="themeSelect" style="width: 100%; padding: 9px 12px; font-size: 13.5px;">
                        <option value="theme-oled" selected>🌙 OLED Black (High Contrast)</option>
                        <option value="theme-dark">🌑 Classic Dark Slate</option>
                        <option value="theme-high-vis">🟨 High Vis (Yellow on Black)</option>
                        <option value="theme-amber">🟡 Stage Amber</option>
                        <option value="theme-slate">🌌 Dark Slate</option>
                        <option value="theme-light">☀️ Clean Light</option>
                        <option value="theme-pro-green">🟢 Pro Green</option>
                        <option value="theme-hacker">💻 Hacker Terminal</option>
                    </select>
                </div>

                <!-- Install PWA Button inside Settings -->
                <button id="btnInstallPwa" class="ctrl-btn" style="display: none; padding: 10px; font-weight: 700; width: 100%; justify-content: center; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.4); color: #60A5FA; font-size: 13px; border-radius: 8px; cursor: pointer;">
                    📲 Install Stage Display PWA
                </button>

                <div style="margin-top: 6px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.12); display: flex; justify-content: flex-end;">
                    <button id="btnDoneSettings" class="ctrl-btn" style="padding: 10px 20px; font-weight: 700; width: 100%; justify-content: center; background: #2563EB; color: #FFFFFF; border: none; font-size: 14.5px; border-radius: 8px; cursor: pointer;">
                        ✓ Done
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="scripturePrompterCard" style="display: none; background: rgba(245, 158, 11, 0.12); border: 2px solid #F59E0B; border-radius: 10px; padding: 16px 20px; margin: 12px 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); backdrop-filter: blur(8px);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="background: #F59E0B; color: #000; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.04em;" id="stageScriptureCitation">📖 SCRIPTURE PASSAGE</span>
            <button type="button" id="btnDismissStageScripture" style="background: none; border: none; color: #F59E0B; font-size: 18px; font-weight: bold; cursor: pointer; padding: 0 6px;" title="Dismiss Scripture Card">✕</button>
        </div>
        <div style="font-size: 26px; font-weight: 700; color: #FEF3C7; line-height: 1.45; font-style: italic;" id="stageScriptureText">...</div>
    </div>

    <!-- Main Scrolling Area -->
    <main class="stage-container" id="stageContainer">
        <div class="transcript-content" id="transcriptContent">
            <div class="empty-indicator" id="emptyNotice">
                Listening for speech... Captions will appear here in real-time.
            </div>
        </div>
    </main>

    <!-- Non-obtrusive Floating Buttons -->
    <!-- 1. Top-Right Settings Gear (Only visible when header is collapsed) -->
    <button class="top-toggle-btn" id="btnToggleHeader" title="Show Header Controls (H)">⚙️</button>

    <!-- 2. Smart 'Jump to Live' Pill (Only visible when scrolled up) -->
    <button class="jump-live-btn" id="btnScrollBottom" title="Jump to Latest Live Speech">⬇️ Jump to Live</button>

    <script>
        // Screen & State
        const isMobile = window.innerWidth <= 768;
        const defaultFontSize = isMobile ? 28 : 48;
        let currentFontSize = defaultFontSize;

        // URL & Preference State
        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = urlParams.get('lang') || localStorage.getItem('voxstream_display_lang') || 'en';
        let currentMode = urlParams.get('mode') || localStorage.getItem('voxstream_display_mode') || 'scrollable';

        // In 'scrollable' mode we retain up to 300 sentences for scrolling back; in 'live' mode only 2 active lines
        let maxHistorySentences = (currentMode === 'live') ? 2 : 300;

        let finalSentences = [];
        let interimText = "";
        let ws = null;
        let autoScroll = true;
        let silenceHideTimer = null;
                let isPacedReadingEnabled = false;
        let isBionicReadingEnabled = false;
        let isFinalOnlyMode = false;

        // DOM Elements
        const stageContainer = document.getElementById('stageContainer');
        const transcriptContent = document.getElementById('transcriptContent');
        const clockDisplay = document.getElementById('clockDisplay');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');
        const displayModeSelect = document.getElementById('displayModeSelect');
        const langSelect = document.getElementById('langSelect');
        const fontSelect = document.getElementById('fontSelect');
        const themeSelect = document.getElementById('themeSelect');
        const headerBar = document.getElementById('headerBar');

        const chkDisplayA11y = document.getElementById('chkDisplayA11y');
        const chkDisplayPacing = document.getElementById('chkDisplayPacing');
        const chkDisplayBionic = document.getElementById('chkDisplayBionic');
        const chkDisplayFinalOnly = document.getElementById('chkDisplayFinalOnly');

        const btnOpenSettings = document.getElementById('btnOpenSettings');
        const btnCloseSettings = document.getElementById('btnCloseSettings');
        const btnDoneSettings = document.getElementById('btnDoneSettings');
        const settingsModal = document.getElementById('settingsModal');

        // Mode Selector: Scrollable History vs Live Prompter
        function applyDisplayMode(mode) {
            currentMode = mode;
            localStorage.setItem('voxstream_display_mode', currentMode);
            if (displayModeSelect) displayModeSelect.value = currentMode;

            if (currentMode === 'live') {
                document.body.classList.add('mode-live');
                maxHistorySentences = 2;
                while (finalSentences.length > 2) finalSentences.shift();

                // Instantly prune DOM to max 2 lines
                if (transcriptContent) {
                    const finals = Array.from(transcriptContent.querySelectorAll('.caption-sentence:not(#liveInterimNode)'));
                    while (finals.length > 2) {
                        const oldNode = finals.shift();
                        oldNode.remove();
                    }
                    scrollToBottom(false);
                }
            } else {
                document.body.classList.remove('mode-live');
                maxHistorySentences = 300;
                if (transcriptContent) {
                    transcriptContent.classList.remove('faded');
                }
                if (finalSentences.length <= 2) {
                    loadServerHistory();
                } else {
                    renderCaptions();
                }
            }
        }

        if (displayModeSelect) {
            displayModeSelect.value = currentMode;
            displayModeSelect.addEventListener('change', (e) => {
                applyDisplayMode(e.target.value);
            });
        }

        // Language Selector
        if (langSelect) {
            langSelect.value = currentLang;
            langSelect.addEventListener('change', async (e) => {
                const newLang = e.target.value;
                currentLang = newLang;
                localStorage.setItem('voxstream_display_lang', currentLang);

                const newUrl = currentLang === 'en'
                    ? window.location.pathname
                    : `${window.location.pathname}?lang=${encodeURIComponent(currentLang)}`;
                window.history.replaceState(null, '', newUrl);

                if (finalSentences.length > 0 && currentLang !== 'en') {
                    const translatedList = await Promise.all(finalSentences.map(async (sentence) => {
                        try {
                            const res = await fetch(`/api/translate?text=${encodeURIComponent(sentence)}&target=${encodeURIComponent(currentLang)}`);
                            if (res.ok) {
                                const data = await res.json();
                                return data.translated || sentence;
                            }
                        } catch (err) {}
                        return sentence;
                    }));
                    finalSentences = translatedList;
                    renderCaptions();
                }

                if (ws) {
                    ws.onclose = null;
                    ws.close();
                }
                connectWebSocket();
            });
        }

        // Live Clock
        function updateClock() {
            if (!clockDisplay) return;
            const now = new Date();
            clockDisplay.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Font Size & Family Controls
        function setFontSize(size) {
            if (!Number.isFinite(size)) size = defaultFontSize;
            currentFontSize = Math.max(18, Math.min(96, size));
            document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
            localStorage.setItem('voxstream_display_fontsize', currentFontSize);
        }

        function setFontFamily(font) {
            document.documentElement.style.setProperty('--font-family', font);
            localStorage.setItem('voxstream_display_font', font);
            if (fontSelect) fontSelect.value = font;
        }

        const savedSize = localStorage.getItem('voxstream_display_fontsize');
        if (savedSize) {
            setFontSize(parseInt(savedSize));
        } else {
            setFontSize(defaultFontSize);
        }

        const savedFont = localStorage.getItem('voxstream_display_font');
        if (savedFont) setFontFamily(savedFont);

        if (fontSelect) {
            fontSelect.addEventListener('change', (e) => {
                setFontFamily(e.target.value);
            });
        }

        // Color Theme
        // FIX: Collect theme classes into array first, then remove — avoids
        // classList iterator mutation bug where classes can be skipped.
        function setTheme(theme) {
            if (!theme || !/^theme-[a-z0-9\-]+$/.test(theme)) return;
            const toRemove = [];
            document.body.classList.forEach(c => {
                if (c.startsWith('theme-')) toRemove.push(c);
            });
            toRemove.forEach(c => document.body.classList.remove(c));
            document.body.classList.add(theme);
            if (themeSelect) themeSelect.value = theme;
        }

        const savedTheme = localStorage.getItem('voxstream_display_theme');
        if (savedTheme) setTheme(savedTheme);

        if (themeSelect) {
            themeSelect.addEventListener('change', (e) => {
                setTheme(e.target.value);
                localStorage.setItem('voxstream_display_theme', e.target.value);
            });
        }

        // 1-Click Accessibility / Visual Aid Mode Handler
        function applyDisplayA11yMode(enabled) {
            if (enabled) {
                document.documentElement.style.setProperty("--letter-spacing", "0.06em");
                document.documentElement.style.setProperty("--word-spacing", "0.15em");
                document.documentElement.style.setProperty("--line-height", "1.65");
                document.documentElement.style.setProperty("--font-style", "normal");
            } else {
                document.documentElement.style.setProperty("--letter-spacing", "normal");
                document.documentElement.style.setProperty("--word-spacing", "normal");
                document.documentElement.style.setProperty("--line-height", "1.45");
                document.documentElement.style.setProperty("--font-style", "normal");
            }
            if (chkDisplayA11y) chkDisplayA11y.checked = enabled;
            try {
                localStorage.setItem("voxstream_display_a11y", enabled ? "true" : "false");
            } catch(e) {}
        }

        try {
            const savedA11y = localStorage.getItem("voxstream_display_a11y") === "true";
            if (savedA11y) applyDisplayA11yMode(true);
        } catch(e) {}

        if (chkDisplayA11y) {
            chkDisplayA11y.addEventListener("change", (e) => applyDisplayA11yMode(e.target.checked));
        }

                // ⚡ Bionic Reading (Saccadic Word Fixation)
        function formatBionicReading(text) {
            if (!text) return '';
            if (!isBionicReadingEnabled) {
                return escapeHtml(text);
            }

            return text.split(/(\s+)/).map(part => {
                if (/^\s+$/.test(part)) return part;
                
                const match = part.match(/^([^a-zA-Z0-9\u00C0-\u024F\u1E00-\u1EFF]*)([a-zA-Z0-9\u00C0-\u024F\u1E00-\u1EFF]+)(.*)$/);
                if (!match) return escapeHtml(part);

                const leadingPunct = escapeHtml(match[1]);
                const word = match[2];
                const trailingPunct = escapeHtml(match[3]);

                const len = word.length;
                let boldLen = 1;
                if (len === 1) boldLen = 1;
                else if (len <= 3) boldLen = 1;
                else if (len <= 5) boldLen = 2;
                else if (len <= 8) boldLen = 3;
                else boldLen = Math.ceil(len * 0.45);

                const boldPart = escapeHtml(word.slice(0, boldLen));
                const restPart = escapeHtml(word.slice(boldLen));

                return `${leadingPunct}<b class="bionic-fixation">${boldPart}</b>${restPart}${trailingPunct}`;
            }).join('');
        }

        function applyDisplayBionicMode(enabled) {
            isBionicReadingEnabled = enabled;
            if (chkDisplayBionic) chkDisplayBionic.checked = enabled;
            try {
                localStorage.setItem("voxstream_display_bionic", enabled ? "true" : "false");
            } catch(e) {}
            renderCaptions();
        }

        try {
            const savedBionic = localStorage.getItem("voxstream_display_bionic") === "true";
            if (savedBionic) applyDisplayBionicMode(true);
        } catch(e) {}

        if (chkDisplayBionic) {
            chkDisplayBionic.addEventListener("change", (e) => applyDisplayBionicMode(e.target.checked));
        }

        // 🐢 Slow Down Text / Paced Mode Handler
        function applyDisplayPacingMode(enabled) {
            isPacedReadingEnabled = enabled;
            if (enabled) {
                document.body.classList.add("slow-flow-mode");
            } else {
                document.body.classList.remove("slow-flow-mode");
            }
            if (chkDisplayPacing) chkDisplayPacing.checked = enabled;
            try {
                localStorage.setItem("voxstream_display_pacing", enabled ? "true" : "false");
            } catch(e) {}
        }

        try {
            const savedPacing = localStorage.getItem("voxstream_display_pacing") === "true";
            if (savedPacing) applyDisplayPacingMode(true);
        } catch(e) {}

        if (chkDisplayPacing) {
            chkDisplayPacing.addEventListener("change", (e) => applyDisplayPacingMode(e.target.checked));
        }

        // ✨ Final-Only Mode Handler (Only show captions once fully prepared)
        function applyDisplayFinalOnlyMode(enabled) {
            isFinalOnlyMode = enabled;
            if (chkDisplayFinalOnly) chkDisplayFinalOnly.checked = enabled;
            try {
                localStorage.setItem("voxstream_display_final_only", enabled ? "true" : "false");
            } catch(e) {}
            if (enabled) {
                interimText = "";
                const interimNode = getInterimNode();
                if (interimNode) {
                    interimNode.textContent = '';
                    interimNode.style.display = 'none';
                }
            }
        }

        try {
            const urlFinalOnly = urlParams.get('final_only');
            if (urlFinalOnly === '1' || urlFinalOnly === 'true' || urlFinalOnly === 'yes') {
                applyDisplayFinalOnlyMode(true);
            } else {
                const savedFinalOnly = localStorage.getItem("voxstream_display_final_only");
                if (savedFinalOnly !== null) {
                    applyDisplayFinalOnlyMode(savedFinalOnly === "true");
                }
            }
        } catch(e) {}

        if (chkDisplayFinalOnly) {
            chkDisplayFinalOnly.addEventListener("change", (e) => applyDisplayFinalOnlyMode(e.target.checked));
        }

        // Settings Modal Open/Close Logic
        if (btnOpenSettings && settingsModal) {
            btnOpenSettings.addEventListener('click', () => {
                settingsModal.style.display = 'flex';
            });
        }
        if (btnCloseSettings && settingsModal) {
            btnCloseSettings.addEventListener('click', () => {
                settingsModal.style.display = 'none';
            });
        }
        if (btnDoneSettings && settingsModal) {
            btnDoneSettings.addEventListener('click', () => {
                settingsModal.style.display = 'none';
            });
        }
        if (settingsModal) {
            settingsModal.addEventListener('click', (e) => {
                if (e.target === settingsModal) {
                    settingsModal.style.display = 'none';
                }
            });
        }

        // Action Buttons
        const btnFontInc = document.getElementById('btnFontInc');
        if (btnFontInc) btnFontInc.addEventListener('click', () => setFontSize(currentFontSize + 4));

        const btnFontDec = document.getElementById('btnFontDec');
        if (btnFontDec) btnFontDec.addEventListener('click', () => setFontSize(currentFontSize - 4));
        
        const btnClear = document.getElementById('btnClear');
        if (btnClear) {
            btnClear.addEventListener('click', () => {
                clearAllCaptions();
            });
        }

        // FIX: Add webkit prefix fallback — requestFullscreen() silently fails
        // in Safari without webkitRequestFullscreen().
        const btnFullscreen = document.getElementById('btnFullscreen');
        if (btnFullscreen) {
            btnFullscreen.addEventListener('click', () => {
                const el = document.documentElement;
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
                if (!isFullscreen) {
                    if (el.requestFullscreen) {
                        el.requestFullscreen().catch(() => {});
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen().catch(() => {});
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            });
        }

        const btnToggleHeader = document.getElementById('btnToggleHeader');
        const btnCollapseHeader = document.getElementById('btnCollapseHeader');
        const btnScrollBottom = document.getElementById('btnScrollBottom');

        function updateFloatingButtons() {
            // 1. Settings Gear: Show at top-right ONLY when top header bar is collapsed
            if (btnToggleHeader && headerBar) {
                if (headerBar.classList.contains('hidden')) {
                    btnToggleHeader.classList.add('visible');
                } else {
                    btnToggleHeader.classList.remove('visible');
                }
            }

            // 2. Jump to Live Button: Show at bottom-right ONLY when scrolled up away from live captions
            if (btnScrollBottom) {
                if (!autoScroll) {
                    btnScrollBottom.classList.add('visible');
                } else {
                    btnScrollBottom.classList.remove('visible');
                }
            }
        }

        if (btnToggleHeader && headerBar) {
            btnToggleHeader.addEventListener('click', () => {
                headerBar.classList.remove('hidden');
                updateFloatingButtons();
            });
        }

        if (btnCollapseHeader && headerBar) {
            btnCollapseHeader.addEventListener('click', () => {
                headerBar.classList.add('hidden');
                updateFloatingButtons();
            });
        }

        if (btnScrollBottom) {
            btnScrollBottom.addEventListener('click', () => {
                autoScroll = true;
                scrollToBottom(true);
                updateFloatingButtons();
            });
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            const tag = (e.target && e.target.tagName) || '';
            if (['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(tag)) return;
            if (e.key === '+' || e.key === '=') setFontSize(currentFontSize + 4);
            if (e.key === '-' || e.key === '_') setFontSize(currentFontSize - 4);
            if (e.key === 's' || e.key === 'S') {
                if (settingsModal) {
                    settingsModal.style.display = settingsModal.style.display === 'flex' ? 'none' : 'flex';
                }
            }
            if (e.key === 'h' || e.key === 'H') {
                if (headerBar) { headerBar.classList.toggle('hidden'); updateFloatingButtons(); }
            }
            if (e.key === 'c' || e.key === 'C') {
                clearAllCaptions();
            }
            if (e.key === 'f' || e.key === 'F') {
                applyDisplayFinalOnlyMode(!isFinalOnlyMode);
            }
        });

        // Silence Timer handling for Live Prompter mode
        function triggerSilenceTimer(timeoutMs = 4000) {
            if (silenceHideTimer) clearTimeout(silenceHideTimer);
            if (currentMode === 'live') {
                silenceHideTimer = setTimeout(() => {
                    if (transcriptContent) transcriptContent.classList.add('faded');
                }, timeoutMs);
            }
        }

        function wakeLiveDisplay() {
            if (silenceHideTimer) {
                clearTimeout(silenceHideTimer);
                silenceHideTimer = null;
            }
            if (transcriptContent) {
                transcriptContent.classList.remove('faded');
            }
        }

        // -------------------------------------------------------------
        // 🛡️ Incremental Caption Rendering Engine
        // -------------------------------------------------------------
        function getInterimNode() {
            let node = document.getElementById("liveInterimNode");
            if (!node && transcriptContent) {
                node = document.createElement("div");
                node.id = "liveInterimNode";
                node.className = "caption-sentence interim";
                node.style.display = "none";
                transcriptContent.appendChild(node);
            }
            return node;
        }

        let isSmoothScrollingToBottom = false;
        let smoothScrollTimer = null;

        function scrollToBottom(smooth = false) {
            if (!stageContainer) return;
            if (smooth) {
                isSmoothScrollingToBottom = true;
                if (smoothScrollTimer) clearTimeout(smoothScrollTimer);
                stageContainer.scrollTo({
                    top: stageContainer.scrollHeight,
                    behavior: 'smooth'
                });
                smoothScrollTimer = setTimeout(() => {
                    isSmoothScrollingToBottom = false;
                    const dist = stageContainer.scrollHeight - stageContainer.scrollTop - stageContainer.clientHeight;
                    autoScroll = dist <= 45;
                    updateFloatingButtons();
                }, 400);
            } else {
                stageContainer.scrollTop = stageContainer.scrollHeight;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        if (stageContainer) {
            stageContainer.addEventListener('scroll', () => {
                if (isSmoothScrollingToBottom) return;
                const dist = stageContainer.scrollHeight - stageContainer.scrollTop - stageContainer.clientHeight;
                if (dist > 45) {
                    autoScroll = false;
                } else if (dist <= 15) {
                    autoScroll = true;
                }
                updateFloatingButtons();
            }, { passive: true });

            // Immediately pause auto-scroll when user scrolls upward with mouse wheel or touch
            stageContainer.addEventListener('wheel', (e) => {
                if (e.deltaY < 0) {
                    isSmoothScrollingToBottom = false;
                    if (smoothScrollTimer) clearTimeout(smoothScrollTimer);
                    autoScroll = false;
                    updateFloatingButtons();
                }
            }, { passive: true });

            stageContainer.addEventListener('touchmove', () => {
                const dist = stageContainer.scrollHeight - stageContainer.scrollTop - stageContainer.clientHeight;
                if (dist > 30) {
                    isSmoothScrollingToBottom = false;
                    if (smoothScrollTimer) clearTimeout(smoothScrollTimer);
                    autoScroll = false;
                    updateFloatingButtons();
                }
            }, { passive: true });
        }

        function removeEmptyIndicator() {
            const emptyEl = transcriptContent ? transcriptContent.querySelector('.empty-indicator') : null;
            if (emptyEl) emptyEl.remove();
        }

        function appendFinalSentence(text) {
            if (!text || !transcriptContent) return;
            removeEmptyIndicator();
            wakeLiveDisplay();

            const el = document.createElement('div');
            el.className = 'caption-sentence';
            el.innerHTML = formatBionicReading(text);

            const existing = transcriptContent.querySelectorAll('.caption-sentence:not(#liveInterimNode)');
            existing.forEach((node) => {
                node.classList.add('previous');
            });

            const interimNode = getInterimNode();
            transcriptContent.insertBefore(el, interimNode);

            const allFinals = transcriptContent.querySelectorAll('.caption-sentence:not(#liveInterimNode)');
            if (allFinals.length > maxHistorySentences) {
                allFinals[0].remove();
            }

            finalSentences.push(text);
            while (finalSentences.length > maxHistorySentences) finalSentences.shift();

            if (interimNode) {
                interimNode.textContent = '';
                interimNode.style.display = 'none';
            }

            if (autoScroll) scrollToBottom(false);

            triggerSilenceTimer(isPacedReadingEnabled ? 12000 : 4000);
        }

        function updateInterimSpeech(text) {
            if (isFinalOnlyMode) return;
            if (!transcriptContent) return;
            removeEmptyIndicator();
            wakeLiveDisplay();

            const interimNode = getInterimNode();
            if (text) {
                interimNode.innerHTML = formatBionicReading(text);
                interimNode.style.display = 'block';
            } else {
                interimNode.textContent = '';
                interimNode.style.display = 'none';
            }

            if (autoScroll) scrollToBottom(false);
        }

        function clearAllCaptions() {
            finalSentences = [];
            interimText = "";
            if (transcriptContent) {
                transcriptContent.innerHTML = '<div class="empty-indicator">Listening for speech... Captions will appear here in real-time.</div>';
            }
            getInterimNode();
        }

        function renderCaptions() {
            if (!transcriptContent) return;
            transcriptContent.innerHTML = '';
            if (finalSentences.length === 0 && !interimText) {
                transcriptContent.innerHTML = '<div class="empty-indicator">Listening for speech... Captions will appear here in real-time.</div>';
                getInterimNode();
                return;
            }

            finalSentences.forEach((sentence, idx) => {
                const el = document.createElement('div');
                el.className = 'caption-sentence';
                if (idx < finalSentences.length - 1) el.classList.add('previous');
                el.innerHTML = formatBionicReading(sentence);
                transcriptContent.appendChild(el);
            });

            const interimNode = getInterimNode();
            if (!isFinalOnlyMode && interimText) {
                interimNode.innerHTML = formatBionicReading(interimText);
                interimNode.style.display = 'block';
            } else {
                interimNode.textContent = '';
                interimNode.style.display = 'none';
            }

            if (autoScroll) scrollToBottom(false);
        }

        // Fetch session transcript history from server so Scrollable History is immediately populated
        async function loadServerHistory() {
            if (currentMode === 'live') return;
            try {
                const res = await fetch('/api/transcript/history?limit=100');
                if (res.ok) {
                    const data = await res.json();
                    if (data.history && data.history.length > 0) {
                        const chronological = [...data.history].reverse();
                        const lines = chronological.map(e => (e.text || '').trim()).filter(Boolean);
                        if (lines.length > 0) {
                            finalSentences = lines;
                            renderCaptions();
                            scrollToBottom(false);
                        }
                    }
                }
            } catch (e) {
                console.error("Failed to load server transcript history:", e);
            }
        }

        // -------------------------------------------------------------
        // 🌐 WebSocket Connection Pipeline
        // -------------------------------------------------------------
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?lang=${encodeURIComponent(currentLang)}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                if (statusText) statusText.textContent = "LIVE";
                if (statusPill) {
                    statusPill.classList.remove('offline');
                    statusPill.title = "Connected to Live Caption Stream";
                }
            };

            ws.onmessage = async (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'snapshot') {
                        if (currentMode !== 'live' && data.lines && data.lines.length > 0 && finalSentences.length === 0) {
                            const snapshotTexts = data.lines.map(l => (typeof l === 'string' ? l : (l.text || ''))).map(t => t.trim()).filter(Boolean);
                            if (snapshotTexts.length > 0) {
                                finalSentences = snapshotTexts;
                                renderCaptions();
                                scrollToBottom(false);
                            }
                        }
                        return;
                    }

                    if (data.type === 'scripture' && data.action === 'show') {
                        showStageScripture(data);
                        return;
                    }
                    if (data.type === 'scripture' && data.action === 'dismiss') {
                        dismissStageScripture();
                        return;
                    }

                    if (data.type === 'clear') {
                        clearAllCaptions();
                        return;
                    }

                    if (data.type === 'caption' || data.text !== undefined) {
                        let text = (data.text || '').trim();
                        if (!text) return;

                        if (currentLang !== 'en') {
                            try {
                                const res = await fetch(`/api/translate?text=${encodeURIComponent(text)}&target=${encodeURIComponent(currentLang)}`);
                                if (res.ok) {
                                    const tData = await res.json();
                                    text = tData.translated || text;
                                }
                            } catch (e) {}
                        }

                        if (data.is_final) {
                            interimText = "";
                            appendFinalSentence(text);
                        } else {
                            if (isFinalOnlyMode) return;
                            interimText = text;
                            updateInterimSpeech(text);
                        }
                    }
                } catch (err) {
                    console.error("WS Parse Error:", err);
                }
            };

            ws.onclose = () => {
                if (statusText) statusText.textContent = "DISCONNECTED";
                if (statusPill) {
                    statusPill.classList.add('offline');
                    statusPill.title = "Connection Lost. Reconnecting in 2s...";
                }
                setTimeout(connectWebSocket, 2000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        async function loadServerOverlayConfig() {
            try {
                const res = await fetch('/api/config');
                if (res.ok) {
                    const cfg = await res.json();
                    if (cfg && cfg.overlay && cfg.overlay.final_only !== undefined) {
                        if (localStorage.getItem("voxstream_display_final_only") === null && !urlParams.has('final_only')) {
                            applyDisplayFinalOnlyMode(Boolean(cfg.overlay.final_only));
                        }
                    }
                }
            } catch(e) {}
        }

        connectWebSocket();
        applyDisplayMode(currentMode);
        loadServerHistory();
        loadServerOverlayConfig();

        function formatEngineBadge(engine, engineName) {
            const raw = (engineName || engine || '').toLowerCase();
            if (raw.includes('gemini')) return 'Gemini';
            if (raw.includes('moonshine')) return 'Moonshine';
            if (raw.includes('whisper')) return 'Whisper';
            if (raw.includes('vosk')) return 'Vosk';
            if (raw.includes('bandwidth')) return 'Bandwidth';
            let clean = (engineName || engine || 'Active').split('(')[0].trim();
            if (clean.length > 10) clean = clean.substring(0, 10);
            return clean;
        }

        async function updateDisplayStatus() {
            try {
                const res = await fetch('/api/status');
                if (res.ok) {
                    const data = await res.json();
                    if (statusText && ws && ws.readyState === WebSocket.OPEN) {
                        if (data.is_switching_engine) {
                            statusText.textContent = `⏳ DOWNLOADING...`;
                            if (statusPill) {
                                statusPill.style.background = "rgba(245, 158, 11, 0.15)";
                                statusPill.style.color = "#F59E0B";
                                statusPill.style.borderColor = "rgba(245, 158, 11, 0.35)";
                                statusPill.title = data.engine_switch_status || "Downloading speech recognition model...";
                            }
                        } else {
                            const shortEngine = formatEngineBadge(data.engine, data.engine_name);
                            statusText.textContent = `LIVE • ${shortEngine}`;
                            if (statusPill) {
                                statusPill.style.background = "rgba(16, 185, 129, 0.12)";
                                statusPill.style.color = "var(--success)";
                                statusPill.style.borderColor = "rgba(16, 185, 129, 0.25)";
                                statusPill.title = `Active Engine: ${data.engine_name || data.engine} | Uptime: ${data.uptime_seconds || 0}s`;
                            }
                        }
                    }
                }
            } catch (e) {}
        }
        updateDisplayStatus();
        updateFloatingButtons();
        setInterval(updateDisplayStatus, 5000);

        // --- Progressive Web App (PWA) & Screen Wake Lock ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }

        // Screen Wake Lock API (keeps iPad/phone screen active on stage)
        let wakeLock = null;
        let isRequestingWakeLock = false;
        async function requestScreenWakeLock() {
            if (!('wakeLock' in navigator) || wakeLock || isRequestingWakeLock) return;
            try {
                isRequestingWakeLock = true;
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (err) {
                // Ignore silent wake lock rejections
            } finally {
                isRequestingWakeLock = false;
            }
        }
        requestScreenWakeLock();
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestScreenWakeLock();
        });
        window.addEventListener('click', () => { if (!wakeLock) requestScreenWakeLock(); });
        window.addEventListener('touchstart', () => { if (!wakeLock) requestScreenWakeLock(); });

        // 1-Click Install App Prompt
        let deferredInstallPrompt = null;
        const btnInstallPwa = document.getElementById('btnInstallPwa');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            if (btnInstallPwa) btnInstallPwa.style.display = 'inline-flex';
        });

        if (btnInstallPwa) {
            btnInstallPwa.addEventListener('click', async () => {
                if (deferredInstallPrompt) {
                    deferredInstallPrompt.prompt();
                    const { outcome } = await deferredInstallPrompt.userChoice;
                    if (outcome === 'accepted') {
                        btnInstallPwa.style.display = 'none';
                    }
                    deferredInstallPrompt = null;
                }
            });
        }

        window.addEventListener('appinstalled', () => {
            if (btnInstallPwa) btnInstallPwa.style.display = 'none';
        });

        // Scripture Prompter Card Logic
        const scripturePrompterCard = document.getElementById("scripturePrompterCard");
        const stageScriptureCitation = document.getElementById("stageScriptureCitation");
        const stageScriptureText = document.getElementById("stageScriptureText");
        const btnDismissStageScripture = document.getElementById("btnDismissStageScripture");
        let stageScriptureTimer = null;

        function showStageScripture(data) {
            if (!scripturePrompterCard) return;
            if (stageScriptureTimer) clearTimeout(stageScriptureTimer);
            
            stageScriptureCitation.textContent = `📖 ${data.citation || ''} • ${data.version || 'BSB'}`;
            stageScriptureText.textContent = `"${data.text || ''}"`;
            scripturePrompterCard.style.display = "block";
            
            const dur = (parseFloat(data.duration_seconds) || 16.0) * 1000;
            stageScriptureTimer = setTimeout(() => {
                dismissStageScripture();
            }, dur);
        }

        function dismissStageScripture() {
            if (stageScriptureTimer) clearTimeout(stageScriptureTimer);
            stageScriptureTimer = null;
            if (scripturePrompterCard) scripturePrompterCard.style.display = "none";
        }

        if (btnDismissStageScripture) {
            btnDismissStageScripture.addEventListener("click", dismissStageScripture);
        }
    
    </script>
</body>
